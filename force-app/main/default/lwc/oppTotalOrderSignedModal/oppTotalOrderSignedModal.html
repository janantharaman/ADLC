<template>
    <div class="modal-content">
        <template if:true={hasData}>
            <table class="slds-table slds-table_bordered slds-table_cell-buffer custom-table">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col" class="slds-text-align_center th-no">
                            <div class="slds-truncate" title="No">No</div>
                        </th>
                        <th scope="col" class="slds-text-align_center th-layer">
                            <div class="slds-truncate" title="Layer Limit">Layer Limit</div>
                        </th>
                        <th scope="col" class="slds-text-align_center th-signed">
                            <div class="slds-truncate" title="Signed Line">Signed Line</div>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={layerPanelData} for:item="row">
                        <tr key={row.layerId} class="slds-hint-parent">
                            <td class="slds-text-align_center">
                                <div class="slds-truncate">{row.rowNumber}</div>
                            </td>
                            <td class="slds-text-align_center">
                                <div class="slds-truncate">{row.layerLimit}</div>
                            </td>
                            <td class="slds-text-align_center">
                                <div class={row.statusClass}>
                                    <div class="status-text">{row.status}</div>
                                    <div class="signed-amount">{row.signedLine}</div>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </template>

        <template if:false={hasData}>
            <div class="slds-text-align_center slds-p-around_medium">{labels.noRecords}</div>
        </template>

        <!-- Footer with Cancel Button -->
        <div class="slds-text-align_right slds-m-top_medium slds-p-top_medium" style="border-top: 1px solid #dddbda">
            <lightning-button variant="neutral" label={labels.close} onclick={handleClose}> </lightning-button>
        </div>
    </div>
</template>
