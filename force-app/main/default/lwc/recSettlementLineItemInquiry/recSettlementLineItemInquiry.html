<template>
    <div class="container">
        <div lwc:if={_isLoading} class="spinner">
            <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
        </div>

        <!-- TITLE -->
        <div class="title slds-text-heading_medium slds-var-p-around_medium slds-text-font_monospace">
            Inquiry Settlement Line Item
        </div>

        <!-- FILTER -->
        <div class="filter-wrapper slds-box slds-box_xx-small slds-var-m-vertical_medium">
            <c-rec-filter-bar filter-defs={filterDefs} filter-width="11" collapsible lwc:ref="filter">
                <lightning-button-group slot="actions">
                    <lightning-button
                        name="action_Inquiry"
                        label="Inquiry"
                        icon-name="utility:search"
                        variant="brand"
                        onclick={handleInquiryClick}
                    ></lightning-button>
                    <lightning-button
                        name="action_Reset"
                        label="Reset"
                        icon-name="utility:undo"
                        variant="neutral"
                        onclick={handleResetClick}
                    ></lightning-button>
                </lightning-button-group>
            </c-rec-filter-bar>
        </div>

        <!-- TABLE -->
        <div class="table-summary">
            <span>Rows: {displayRowCount} / Selected: {displaySelectedCount}</span>
            <div class="table-actions">
                <lightning-button-group>
                    <lightning-button-icon
                        name="action_ExpandAll"
                        label="Expand All"
                        title="Expand All"
                        icon-name="utility:add"
                        variant="neutral"
                        onclick={handleExpandAllClick}
                    ></lightning-button-icon>
                    <lightning-button-icon
                        name="action_CollapseAll"
                        label="Collapse All"
                        title="Collapse All"
                        icon-name="utility:dash"
                        variant="neutral"
                        onclick={handleCollapseAllClick}
                    ></lightning-button-icon>
                </lightning-button-group>
                <lightning-button
                    variant="neutral"
                    label="Export"
                    icon-name="utility:download"
                    class="slds-p-horizontal_small"
                    onclick={handleExportClick}
                ></lightning-button>
                <lightning-button-group>
                    <lightning-button
                        name="action_Split"
                        label="SLI Split"
                        variant="neutral"
                        disabled={splitBtnDisabled}
                        onclick={handleSplitClick}
                    ></lightning-button>
                    <lightning-button
                        name="action_PPWDate"
                        label="PPW Date"
                        variant="neutral"
                        disabled={ppwDateBtnDisabled}
                        onclick={handlePPWDateClick}
                    ></lightning-button>
                    <lightning-button
                        name="action_OutwardFunds"
                        label="Outward Funds"
                        variant="neutral"
                        onclick={handleOutwardFundsClick}
                    ></lightning-button>
                    <lightning-button
                        name="action_Confirm"
                        label="Confirm"
                        variant="neutral"
                        onclick={handleConfirmClick}
                    ></lightning-button>
                </lightning-button-group>
            </div>
        </div>
        <div class="table-wrapper">
            <c-rec-table
                lwc:ref="table"
                key-field="Id"
                columns={tableColumns}
                data={tableData}
                onrowselection={handleRowSelection}
                oncellchange={handleCellChange}
                oncellbuttonclick={handleCellButtonClick}
                ongroupcollapse={handleGroupCollapse}
                ondirtystatechange={handleDirtyStateChange}
            ></c-rec-table>
        </div>
    </div>
</template>
