<template>
    <lightning-card>

        <template if:true={isLoading}>
            <div class="spinner-container">
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </div>
        </template>

        <lightning-layout vertical-align="center" class="slds-m-bottom_small">

            <lightning-layout-item flexibility="grow">
                <div class="slds-grid slds-gutters_small slds-align-middle">

                    <div class="slds-size_3-of-12 slds-m-horizontal_x-small">
                        <lightning-input
                                type="search"
                                label="Reinsurer"
                                variant="label-inline"
                                value={searchParams.reinsurer}
                                onchange={handleInputChange}
                                data-field="name">
                        </lightning-input>
                    </div>

                    <div class="slds-size_3-of-12 slds-m-horizontal_x-small">
                        <lightning-input
                                type="date"
                                label="Period From"
                                variant="label-inline"
                                value={searchParams.periodFrom}
                                onchange={handleInputChange}
                                data-field="from">
                        </lightning-input>
                    </div>

                    <div class="slds-size_3-of-12 slds-m-horizontal_x-small">
                        <lightning-input
                                type="date"
                                label="Period To"
                                variant="label-inline"
                                value={searchParams.periodTo}
                                onchange={handleInputChange}
                                data-field="to">
                        </lightning-input>
                    </div>

                    <div class="slds-size_3-of-12 slds-grid slds-align-middle slds-gutters_xx-small">
                        <lightning-button
                                label={labels.search}
                                title="Search"
                                variant="brand"
                                onclick={handleSearch}>
                        </lightning-button>
                        <lightning-button
                                label={labels.reset}
                                title="Reset"
                                onclick={handleReset}>
                        </lightning-button>
                    </div>

                </div>
            </lightning-layout-item>

            <lightning-layout-item alignment-bump="left">
                <lightning-button-group>
                    <lightning-button-icon
                            icon-name="utility:refresh"
                            alternative-text="Refresh"
                            variant="border"
                            class="refresh-btn"
                            onclick={handleRefresh}>
                    </lightning-button-icon>
                    <lightning-button label={labels.add} title="Add" onclick={handleAdd} disabled={isReadOnly}></lightning-button>
                    <lightning-button label={labels.delete} title="Delete" onclick={handleDeleteNewRows} disabled={isDeleteDisabled}></lightning-button>
                    <lightning-button label={labels.save} title="Save" variant="brand" onclick={handleSave} disabled={isReadOnly}></lightning-button>
                </lightning-button-group>
            </lightning-layout-item>

        </lightning-layout>


        <div class="related-list">
            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                <colgroup>
                    <col style="width:2%">
                    <col style="width:2%">
                    <col style="width:15%">
                    <!--<col style="width:15%">-->
                    <col style="width:15%">
                    <col style="width:12%">
                    <col style="width:14%">
                    <col style="width:14%">
                    <col style="width:15%">
                    <col style="width:5%">
                    <col style="width:12%">
                </colgroup>
                <thead>
                <tr>
                    <th scope="col" class="slds-text-align_center"><input type="checkbox" data-role="selectAll" onchange={handleSelectAll}></th>
                    <th scope="col" class="slds-text-align_center"></th>
                    <th scope="col" class="slds-text-align_center" title={ACCNameLabel}> {ACCNameLabel} </th>
                    <!--<th scope="col" class="slds-text-align_center" title={MGANameLabel}> {MGANameLabel} </th>-->
                    <th scope="col" class="slds-text-align_center" title={ReinsurerNameLabel}> {ReinsurerNameLabel} </th>
                    <th scope="col" class="slds-text-align_center" title={CountryLabel}> {CountryLabel} </th>
                    <th scope="col" class="slds-text-align_center" title={BindingFromLabel}> {BindingFromLabel} </th>
                    <th scope="col" class="slds-text-align_center" title={BindingToLabel}> {BindingToLabel} </th>
                    <th scope="col" class="slds-text-align_center" title={RemarksLabel}> {RemarksLabel} </th>
                    <th scope="col" class="slds-text-align_center"> {labels.active} </th>
                    <th scope="col" class="slds-text-align_center"> {labels.letterOfAuthority} </th>
                </tr>
                </thead>

                <tbody>
                <!-- 조회된 레코드 출력 -->
                <template for:each={displayRecords} for:item="rec">
                    <tr key={rec.Id} class={rec.rowClass}>

                        <!-- Checkbox -->
                        <td>
                            <label>
                                <input
                                        type="checkbox"
                                        data-role="rowCheckbox"
                                        data-id={rec.Id}
                                        onchange={handleRowSelect}
                                        disabled={rec.disableSelect}
                                >
                            </label>
                        </td>

                        <!-- RowNo -->
                        <td>
                            {rec.rowNo}
                        </td>

                        <!-- Name -->
                        <td>
                            <a class="slds-truncate record-link"
                               data-record-id={rec.Id}
                               data-object-api-name="ACC_AdditionalInfo__c"
                               onclick={handleNavigateToRecord}>
                                {rec.Name}
                            </a>

                        </td>

                        <!-- Reinsurer -->
                        <td data-id={rec.Id} onclick={handleRowEdit} class={rec.Reinsurer_lk__cCellClass}>
                            <!-- VIEW  -->
                            <template if:false={rec.isEditing}>
                                <a class="slds-truncate record-link"
                                   data-record-id={rec.Reinsurer_lk__c}
                                   data-object-api-name="Account"
                                   onclick={handleNavigateToRecord}>
                                    {rec.ReinsurerName}
                                </a>
                            </template>

                            <!-- EDIT -->
                            <template if:true={rec.isEditing}>
                                {rec.ReinsurerName}
                            </template>

                        </td>

                        <td data-id={rec.Id}>
                                 <span class="cell-text">{rec.CountryLabel}</span>
                        </td>

                        <td data-id={rec.Id} onclick={handleRowEdit} class={rec.BindingFrom__cCellClass}>
                            <template if:false={rec.isEditing}>
                                {rec.BindingFrom__c}
                            </template>

                            <template if:true={rec.isEditing}>
                                {rec.BindingFrom__c}
                            </template>
                        </td>

                        <td data-id={rec.Id} onclick={handleRowEdit} class={rec.BindingTo__cCellClass}>
                            <template if:false={rec.isEditing}>
                                {rec.BindingTo__c}
                            </template>
                            <template if:true={rec.isEditing}>
                                {rec.BindingTo__c}
                            </template>
                        </td>

                        <td data-id={rec.Id} onclick={handleRowEdit} class={rec.Remarks__cCellClass}>
                            <template if:false={rec.isEditing}>
                                {rec.Remarks__c}

                                <lightning-icon
                                        icon-name="utility:edit"
                                        size="xx-small"
                                        class="slds-m-left_x-small edit-icon"
                                        data-id={rec.Id}
                                        onclick={handleEditClick}>
                                </lightning-icon>
                            </template>
                            <template if:true={rec.isEditing}>
                                <lightning-input
                                        data-id={rec.Id}
                                        data-field="Remarks__c"
                                        value={rec.Remarks__c}
                                        onchange={handleInlineChange}>
                                </lightning-input>
                            </template>
                        </td>

                        <td class="slds-text-align_center">
                            <lightning-input type="checkbox" checked={rec.ActiveSecurity_is__c} disabled>
                            </lightning-input>
                        </td>

                        <td class="slds-text-align_center">
                                <a href="javascript:void(0);"
                                   data-id={rec.Id}
                                   onclick={handleOpenFiles}>
                                    View Files
                                </a>
                        </td>
                    </tr>
                </template>

                <!-- 데이터 조회 안되는 경우 -->
                <template if:true={noData}>
                    <tr>
                        <td colspan="12" class="slds-text-align_center slds-text-color_weak">
                            <p class="slds-m-top_small">{labels.noRecords}</p>
                        </td>
                    </tr>
                </template>

                <!-- Add 버튼 클릭 시 나타나는 입력 Row -->
                <template for:each={newRecords} for:item="newRec">
                    <tr key={newRec.key}>
                        <td class="slds-text-align_center">
                            <lightning-input
                                    type="checkbox"
                                    data-id={newRec.key}
                                    data-role="rowCheckbox"
                                    onchange={handleRowSelect}
                                    checked={newRec.isSelected}
                                    disabled={newRec.disableSelect}>
                            </lightning-input>
                        </td>
                        <td class="slds-text-align_center">
                            {newRec.rowNo}
                        </td>

                        <!-- Name -->
                        <td>
                        </td>

                        <!--<td>
                            <c-com-lookup
                                    value={newRec.Account_lk__c}
                                    placeholder="Select MGA"
                                    icon-name="standard:account"
                                    data-key={newRec.key}
                                    data-field="Account_lk__c"
                                    config={getReinsurerLookupConfig}
                                    onlookupchange={handleLookupChange}>
                            </c-com-lookup>
                        </td>-->

                        <td class={newRec.hasErrorClassReinsurer}>
                            <c-com-lookup
                                    value={newRec.Reinsurer_lk__c}
                                    placeholder="Select Reinsurer"
                                    icon-name="standard:account"
                                    data-rowkey={newRec.key}
                                    field-name="Reinsurer_lk__c"
                                    config={reinsurerLookupConfig}
                                    onlookupchange={handleLookupChange}>
                            </c-com-lookup>
                        </td>

                        <td>
                            <lightning-formatted-text
                                    value={newRec.CountryLabel}>
                            </lightning-formatted-text>
                        </td>

                        <td class={newRec.hasErrorClassFrom}>
                            <lightning-input
                                    data-key={newRec.key}
                                    type="date"
                                    data-field="BindingFrom__c"
                                    onchange={handleNewFieldChange}></lightning-input>
                        </td>

                        <td class={newRec.hasErrorClassTo}>
                            <lightning-input
                                    data-key={newRec.key}
                                    type="date"
                                    data-field="BindingTo__c"
                                    onchange={handleNewFieldChange}></lightning-input>
                        </td>

                        <td>
                            <lightning-input
                                    data-key={newRec.key}
                                    data-field="Remarks__c"
                                    onchange={handleNewFieldChange}></lightning-input>
                        </td>

                        <td class="slds-text-align_center">
                            <lightning-input
                                    data-key={newRec.key}
                                    type="checkbox"
                                    disabled="true"
                                    data-field="ActiveSecurity_is__c"
                                    onchange={handleNewFieldChange}>
                            </lightning-input>
                        </td>
                        <td></td>
                    </tr>
                </template>

                </tbody>
            </table>
        </div>

        <template if:true={showViewAll}>
            <div class="buttons slds-text-align_center">
                <lightning-button variant="base" label={labels.viewAll} onclick={handleViewAll}>
                </lightning-button>
            </div>
        </template>

    </lightning-card>
</template>
