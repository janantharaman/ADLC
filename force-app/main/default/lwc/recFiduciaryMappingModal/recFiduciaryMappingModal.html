<template>
    <lightning-modal-header label="New Fiduciary Others"></lightning-modal-header>

    <lightning-modal-body>
        <c-rec-table
            lwc:ref="table"
            key-field="RefBankTransaction__c"
            data={tableData}
            columns={tableColumns}
            oncellchange={handleCellChange}
            hide-checkbox-column
        ></c-rec-table>
    </lightning-modal-body>

    <lightning-modal-footer>
        <lightning-button label="Cancel" class="slds-var-m-right_small" onclick={handleCancelClick}></lightning-button>
        <lightning-button label="Save" variant="brand" onclick={handleSaveClick}></lightning-button>
    </lightning-modal-footer>
</template>
