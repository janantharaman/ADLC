<template>
    <div class="slds-p-around_medium slds-p-left_large">
        <lightning-card title={pageTitleDisplay} icon-name="standard:record">
            <div slot="actions" class="slds-p-horizontal_small slds-grid slds-grid_align-end">
                <template if:true={showExcelButton}>
                    <lightning-button-group >
                        <lightning-button-icon
                                icon-name="action:refresh"
                                title={labels.COM_LBL_REFRESH}
                                onclick={handleRefresh}>
                        </lightning-button-icon>
<!--                    <lightning-button-->
<!--                            label="Export & Send Email"-->
<!--                            icon-name="utility:email"-->
<!--                            disabled={isExportBtnDisabled}-->
<!--                            onclick={handleExport}>-->
<!--                    </lightning-button>-->
                        <lightning-button
                                label="Save as Excel"
                                icon-name="utility:download"
                                variant="brand"
                                onclick={handleSaveAsExcel}
                                disabled={isExportBtnDisabled}>
                        </lightning-button>
                    </lightning-button-group>
                </template>
            </div>

            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>

            <div class="slds-p-horizontal_small" style={tableStyle}>
                <c-rec-table
                        lwc:ref="table"
                        key-field="Id"
                        columns={tableColumns}
                        data={tableData}
                        hide-checkbox-column={hideCheckbox}
                ></c-rec-table>
            </div>
        </lightning-card>
    </div>
</template>
