<template>
    <div class ="fsRoot">
        <div class="slds-p-around_small slds-theme_shade slds-border_bottom">

            <div class="slds-col slds-grow slds-text-heading_small slds-truncate" title={tsiTitle}>
                <strong>{tsiTitle}</strong>
            </div>
            <!-- Error -->
            <template if:true={mismatchError}>
                <div class="slds-notify slds-notify_alert slds-alert_error ">
                    <span class="slds-assistive-text">Error</span>
                    TSI mismatch for: {mismatchCurrencies}
                </div>
            </template>

            <div class="slds-grid slds-grid_align-end slds-m-bottom_x-small">
                <lightning-button-group>
                    <lightning-button-icon data-action="fullScreen" icon-name={iconName} alternative-text={buttonLabel} title={buttonLabel} variant="border-filled" onclick={handleAction} disabled={isActionDisabled}></lightning-button-icon>
                    <lightning-button data-action="download" label="Download" variant="brand-outline" onclick={handleAction} disabled={isActionDisabled}></lightning-button>
                    <lightning-button data-action="template" label={labels.template} variant="brand-outline" onclick={handleAction} disabled={isActionDisabled}></lightning-button>
                    <!--<lightning-button data-action="upload" label="Upload" variant="brand-outline"  onclick={handleAction} disabled={isSaveDisabled}></lightning-button>-->
                    <lightning-button
                            label={labels.upload}
                            data-action="upload"
                            onclick={handleAction}
                            disabled={isEditDisabled}>
                    </lightning-button>
                </lightning-button-group>
                <input
                        type="file"
                        accept=".xlsx,.xls"
                        data-id="fileInput"
                        onchange={handleUploadClick}
                        class="slds-hide"/>

                <lightning-button-group>
                    <lightning-button-icon
                            data-action="refresh"
                            icon-name="utility:refresh"
                            alternative-text="Refresh"
                            variant="border"
                            class="refresh-btn slds-p-left_x-small"
                            onclick={handleAction}
                            disabled={isActionDisabled}>
                    </lightning-button-icon>
                    <lightning-button data-action="add" label={labels.add} variant="brand-outline" onclick={handleAction} disabled={isEditDisabled}></lightning-button>
                    <lightning-button data-action="delete" label={labels.delete} variant="brand-outline" onclick={handleAction} disabled={isEditDisabled}></lightning-button>
                    <lightning-button data-action="save" label={labels.save} variant="brand" onclick={handleAction} disabled={isSaveDisabled}></lightning-button>
                </lightning-button-group>
                <!--<c-opp-t-s-i-upload-modal record-id={recordId}></c-opp-t-s-i-upload-modal>-->
            </div>
            <div class="table-scroll-x">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered custom-table">
                    <colgroup>
                        <col style="width:50px"> <!-- CheckBox -->
                        <col style="width:50px"> <!-- No -->
                        <col style="width:200px"> <!-- Location Name -->
                        <col style="width:270px"> <!-- Address -->
                        <col style="width:180px"> <!-- Latitude -->
                        <col style="width:180px"> <!-- Longitude -->
                        <col style="width:150px"> <!-- Address (ZIP/Postal Code)  -->
                        <col style="width:250px"> <!-- Covered Section -->
                        <col style="width:250px"> <!-- Asset -->
                        <col style="width:150px"> <!-- TSI Currency -->
                        <col style="width:180px"> <!-- Insured Amount -->
                        <col style="width:180px"> <!-- Gross Rate (%) -->
                        <col style="width:180px"> <!-- DP (%) -->
                        <col style="width:150px"> <!-- Premium Currency -->
                        <col style="width:180px"> <!-- FxRatePremCurrency -->
                        <col style="width:180px"> <!-- Gross Prem (Before DP) -->
                        <col style="width:180px"> <!-- Gross Prem -->
                    </colgroup>
                    <thead>
                        <tr>
                            <th>
                                <lightning-input label="" type="checkbox" checked={isAllSelected} onchange={handleSelectAll} disabled={isEditDisabled}></lightning-input>
                            </th>
                            <th scope="col" class="slds-text-align_center" title="No">No.</th>
                            <th scope="col" class="slds-text-align_center" title={LocationNameLabel}>{LocationNameLabel}</th>
                            <th scope="col" class="slds-text-align_center" title={UndefinedLocationLabel}>{UndefinedLocationLabel}</th>
                            <th scope="col" class="slds-text-align_center" title={AddressLabel}>{AddressLabel}</th>
                            <th scope="col" class="slds-text-align_center" title={LatitudeLabel}>{LatitudeLabel}</th>
                            <th scope="col" class="slds-text-align_center" title={LongitudeLabel}>{LongitudeLabel}</th>
                            <th scope="col" class="slds-text-align_center" title={PostalCodeLabel}>{PostalCodeLabel}</th>
                            <th scope="col" class="slds-text-align_center" title={CoveredSectionLabel}>{CoveredSectionLabel}</th>
                            <th scope="col" class="slds-text-align_center" title={AssetLabel}>{AssetLabel}</th>
                            <th scope="col" class="slds-text-align_center" title={TSICurrencyLabel}>{TSICurrencyLabel}</th>
                            <th scope="col" class="slds-text-align_center" title={InsuredAmountLabel}>{InsuredAmountLabel}</th>
                            <th scope="col" class="slds-text-align_center" title={GrossRateLabel}>{GrossRateLabel}</th>
                            <th scope="col" class="slds-text-align_center" title={DPLabel}>{DPLabel}</th>
                            <th scope="col" class="slds-text-align_center" title={PremiumCurrencyLabel}>{PremiumCurrencyLabel}</th>
                            <th scope="col" class="slds-text-align_center" title={FxRatePremCurrencyLabel}>{FxRatePremCurrencyLabel}</th>
                            <th scope="col" class="slds-text-align_center" title={GrossPremDPLabel}>{GrossPremDPLabel}</th>
                            <th scope="col" class="slds-text-align_center" title={GrossPremLabel}>{GrossPremLabel}</th>
                        </tr>
                    </thead>

                    <tbody>
                        <template for:each={data} for:item="row">
                            <tr key={row.key}>
                                <!-- Checkbox -->
                                <td>
                                    <lightning-input
                                            label=""
                                            type="checkbox"
                                            data-key={row.key}
                                            checked={row._checked}
                                            onchange={handleRowSelect}
                                            disabled={isEditDisabled}>
                                    </lightning-input>
                                </td>

                                <!-- No -->
                                <td class="slds-text-align_center">{row.no}</td>

                                <!-- Location Name -->
                                <td class={row._tdClasses.LocationName__c} onmouseenter={handleRowHover}
                                    onmouseleave={handleRowLeave}
                                    data-key={row.key}>

                                    <template if:false={row._isEditing}>
                                        <div class="cell-container">
                                            <span class="cell-view">{row.LocationName__c}</span>

                                            <template if:true={row._showEdit}>
                                                <lightning-button-icon
                                                        icon-name="utility:edit"
                                                        size="small"
                                                        variant="bare"
                                                        data-key={row.key}
                                                        onclick={handleEditRow}
                                                        disabled={isEditDisabled}>
                                                </lightning-button-icon>
                                            </template>
                                        </div>
                                    </template>

                                    <template if:true={row._isEditing}>
                                        <lightning-input
                                                label="Name"
                                                variant="label-hidden"
                                                value={row.LocationName__c}
                                                data-key={row.key}
                                                data-field="LocationName__c"
                                                onchange={handleExistingRowChange}
                                                disabled={row._isRowEditDisabled}>
                                        </lightning-input>
                                    </template>
                                </td>

                                <!-- Undefined Location -->
                                <td class={row._tdClasses.UnamedLocation__c}
                                    onmouseenter={handleRowHover}
                                    onmouseleave={handleRowLeave}
                                    data-key={row.key}>

                                    <template if:false={row._isEditing}>
                                        <div class="cell-container">
                                            <div class="cell-view slds-text-align_center">
                                                <lightning-input
                                                        label="UnamedLocation"
                                                        variant="label-hidden"
                                                        type="checkbox"
                                                        checked={row.UnamedLocation__c}
                                                        disabled>
                                                </lightning-input>
                                            </div>

                                            <template if:true={row._showEdit}>
                                                <div class="edit-icon-wrap">
                                                    <lightning-button-icon
                                                            icon-name="utility:edit"
                                                            size="small"
                                                            variant="bare"
                                                            data-key={row.key}
                                                            onclick={handleEditRow}
                                                            disabled={isEditDisabled}>
                                                    </lightning-button-icon>
                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <template if:true={row._isEditing}>
                                        <lightning-combobox
                                                data-key={row.key}
                                                data-field="UnamedLocation__c"
                                                value={row.UnamedLocation__c}
                                                options={undefinedOptions}
                                                onchange={handleExistingRowChange}
                                                disabled={row._isRowEditDisabled}>
                                        </lightning-combobox>
                                    </template>
                                </td>

                                <!-- Address -->
                                <td class={row._tdClasses.Address}>
                                    <!-- VIEW MODE -->
                                    <template if:false={row._isEditing}>
                                        <div class="address-container">
                                            <a href={row.googleMapUrl}
                                               target="_blank"
                                               rel="noopener noreferrer"
                                               class="cell-view map-link">
                                                <div class="address-cell">
                                                    <div>{row.Address__c.street}</div>
                                                    <div>
                                                        {row.Address__c.city}
                                                        <template if:true={row.Address__c.postalCode}>
                                                            {row.Address__c.postalCode}
                                                        </template>
                                                    </div>
                                                    <div>{row.Address__c.country}</div>
                                                </div>
                                            </a>

                                            <template if:true={row._showEdit}>
                                                <lightning-button-icon
                                                        icon-name="utility:edit"
                                                        size="small"
                                                        variant="bare"
                                                        data-key={row.key}
                                                        onclick={handleEditRow}
                                                        disabled={isEditDisabled}>
                                                </lightning-button-icon>
                                            </template>
                                        </div>
                                    </template>

                                    <!-- EDIT MODE -->
                                    <template if:true={row._isEditing}>
                                        <!-- search -->
                                        <lightning-input
                                                label="searchAddress"
                                                variant="label-hidden"
                                                type="search"
                                                placeholder="Search address"
                                                data-key={row.key}
                                                onchange={handleExistingAddressSearch}
                                                disabled={row._isAddressDisabledFinal}>
                                        </lightning-input>

                                        <!-- address input -->
                                        <lightning-input-address
                                                street-label="Street"
                                                city-label="City"
                                                province-label="State"
                                                postal-code-label="Postal Code"
                                                country-label="Country"
                                                street={row.Address__c.street}
                                                city={row.Address__c.city}
                                                province={row.Address__c.state}
                                                postal-code={row.Address__c.postalCode}
                                                country={row.Address__c.country}
                                                data-key={row.key}
                                                onchange={handleExistingAddressChange}
                                                disabled={row._isAddressDisabledFinal}>
                                        </lightning-input-address>
                                    </template>
                                </td>

                               <!-- Latitude -->
                                <td class={row._tdClasses.GPSCoordinates__Latitude__s}
                                    onmouseenter={handleRowHover}
                                    onmouseleave={handleRowLeave}
                                    data-key={row.key}>

                                    <template if:false={row._isEditing}>
                                        <div class="cell-container">
                                            <span class="cell-view">{row.GPSCoordinates__Latitude__s}</span>

                                            <template if:true={row._showEdit}>
                                                <lightning-button-icon
                                                        icon-name="utility:edit"
                                                        size="small"
                                                        variant="bare"
                                                        data-key={row.key}
                                                        onclick={handleEditRow}
                                                        disabled={isEditDisabled}>
                                                </lightning-button-icon>
                                            </template>
                                        </div>
                                    </template>

                                    <template if:true={row._isEditing}>
                                        <lightning-input
                                                label="GPSCoordinates__Latitude"
                                                variant="label-hidden"
                                                value={row.GPSCoordinates__Latitude__s}
                                                data-key={row.key}
                                                data-field="GPSCoordinates__Latitude__s"
                                                onchange={handleExistingRowChange}
                                                disabled={row._isLatLngDisabledFinal}>
                                        </lightning-input>
                                    </template>
                                </td>

                                <!-- Longitude -->
                                <td class={row._tdClasses.GPSCoordinates__Longitude__s}
                                    onmouseenter={handleRowHover}
                                    onmouseleave={handleRowLeave}
                                    data-key={row.key}>

                                    <template if:false={row._isEditing}>
                                        <div class="cell-container">
                                            <span class="cell-view">{row.GPSCoordinates__Longitude__s}</span>

                                            <template if:true={row._showEdit}>
                                                <lightning-button-icon
                                                        icon-name="utility:edit"
                                                        size="small"
                                                        variant="bare"
                                                        data-key={row.key}
                                                        onclick={handleEditRow}
                                                        disabled={isEditDisabled}>
                                                </lightning-button-icon>
                                            </template>
                                        </div>
                                    </template>

                                    <template if:true={row._isEditing}>
                                        <lightning-input
                                                label="GPSCoordinates__Longitude"
                                                variant="label-hidden"
                                                value={row.GPSCoordinates__Longitude__s}
                                                data-key={row.key}
                                                data-field="GPSCoordinates__Longitude__s"
                                                onchange={handleExistingRowChange}
                                                disabled={row._isLatLngDisabledFinal}>
                                        </lightning-input>
                                    </template>
                                </td>

                                <!-- Postal Code -->
                                <td class={row._tdClasses.Address_postalCode}
                                    onmouseenter={handleRowHover}
                                    onmouseleave={handleRowLeave}
                                    data-key={row.key}>

                                    <template if:false={row._isEditing}>
                                        <div class="cell-container">
                                            <span class="cell-view">{row.Address__c.postalCode}</span>

                                            <template if:true={row._showEdit}>
                                                <lightning-button-icon
                                                        icon-name="utility:edit"
                                                        size="small"
                                                        variant="bare"
                                                        data-key={row.key}
                                                        onclick={handleEditRow}
                                                        disabled={isEditDisabled}>
                                                </lightning-button-icon>
                                            </template>
                                        </div>
                                    </template>

                                    <template if:true={row._isEditing}>
                                        <lightning-input
                                                label="PostalCode"
                                                variant="label-hidden"
                                                value={row.Address__c.postalCode}
                                                data-key={row.key}
                                                data-field="Address_postalCode"
                                                onchange={handleExistingRowChange}
                                                disabled={row._isAddressDisabledFinal}>
                                        </lightning-input>
                                    </template>
                                </td>

                                <!-- Covered Section -->
                                <td class={row._tdClasses.CoveredSection__c}
                                    onmouseenter={handleRowHover}
                                    onmouseleave={handleRowLeave}
                                    data-key={row.key}>

                                    <template if:false={row._isEditing}>
                                        <div class="cell-container">
                                            <span class="cell-view">{row.CoveredSection__c}</span>

                                            <template if:true={row._showEdit}>
                                                <lightning-button-icon
                                                        icon-name="utility:edit"
                                                        size="small"
                                                        variant="bare"
                                                        data-key={row.key}
                                                        onclick={handleEditRow}
                                                        disabled={isEditDisabled}>
                                                </lightning-button-icon>
                                            </template>
                                        </div>
                                    </template>

                                    <template if:true={row._isEditing}>
                                        <lightning-input
                                                label="CoveredSection"
                                                variant="label-hidden"
                                                value={row.CoveredSection__c}
                                                data-key={row.key}
                                                data-field="CoveredSection__c"
                                                onchange={handleExistingRowChange}
                                                disabled={row._isRowEditDisabled}>
                                        </lightning-input>
                                    </template>
                                </td>

                                <!-- Asset -->
                                <td class={row._tdClasses.Asset__c}
                                    onmouseenter={handleRowHover}
                                    onmouseleave={handleRowLeave}
                                    data-key={row.key}>

                                    <template if:false={row._isEditing}>
                                        <div class="cell-container">
                                            <span class="cell-view">{row.Asset__c}</span>

                                            <template if:true={row._showEdit}>
                                                <lightning-button-icon
                                                        icon-name="utility:edit"
                                                        size="small"
                                                        variant="bare"
                                                        data-key={row.key}
                                                        onclick={handleEditRow}
                                                        disabled={isEditDisabled}>
                                                </lightning-button-icon>
                                            </template>
                                        </div>
                                    </template>

                                    <template if:true={row._isEditing}>
                                        <lightning-input
                                                label="Asset"
                                                variant="label-hidden"
                                                value={row.Asset__c}
                                                data-key={row.key}
                                                data-field="Asset__c"
                                                onchange={handleExistingRowChange}
                                                disabled={row._isRowEditDisabled}>
                                        </lightning-input>
                                    </template>
                                </td>

                                <!-- TSI Currency -->
                                <td class={row._tdClasses.TSICurrency__c}
                                    onmouseenter={handleRowHover}
                                    onmouseleave={handleRowLeave}
                                    data-key={row.key}>

                                    <template if:false={row._isEditing}>
                                        <div class="cell-container">
                                            <span class="cell-view">{row.TSICurrency__c}</span>

                                            <template if:true={row._showEdit}>
                                                <lightning-button-icon
                                                        icon-name="utility:edit"
                                                        size="small"
                                                        variant="bare"
                                                        data-key={row.key}
                                                        onclick={handleEditRow}
                                                        disabled={isEditDisabled}>
                                                </lightning-button-icon>
                                            </template>
                                        </div>
                                    </template>

                                    <template if:true={row._isEditing}>
                                        <lightning-combobox
                                                data-key={row.key}
                                                data-field="TSICurrency__c"
                                                value={row.TSICurrency__c}
                                                options={TSICurrencyOptions}
                                                onchange={handleComboboxChange}
                                                variant="label-hidden"
                                                dropdown-alignment="auto"
                                                disabled={row._isRowEditDisabled}>
                                        </lightning-combobox>
                                    </template>
                                </td>

                                <!-- Insured Amount -->
                                <td class={row._tdClasses.InsuredAmount__c}
                                    onmouseenter={handleRowHover}
                                    onmouseleave={handleRowLeave}
                                    data-key={row.key}>

                                    <template if:false={row._isEditing}>
                                        <div class="cell-container">
                                            <div class="cell-view slds-text-align_right">
                                                <lightning-formatted-number value={row.InsuredAmount__c}>
                                                </lightning-formatted-number>
                                            </div>

                                            <template if:true={row._showEdit}>
                                                <div class="edit-icon-wrap">
                                                    <lightning-button-icon
                                                            icon-name="utility:edit"
                                                            size="small"
                                                            variant="bare"
                                                            data-key={row.key}
                                                            onclick={handleEditRow}
                                                            disabled={isEditDisabled}>
                                                    </lightning-button-icon>
                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <template if:true={row._isEditing}>
                                        <lightning-input
                                                label="InsuredAmount"
                                                variant="label-hidden"
                                                value={row.InsuredAmount__c}
                                                data-key={row.key}
                                                data-field="InsuredAmount__c"
                                                onchange={handleExistingRowChange}
                                                disabled={row._isRowEditDisabled}>
                                        </lightning-input>
                                    </template>
                                </td>

                                <!-- Gross Rate -->
                                <td class={row._tdClasses.GrossRatePct__c}
                                    onmouseenter={handleRowHover}
                                    onmouseleave={handleRowLeave}
                                    data-key={row.key}>

                                    <template if:false={row._isEditing}>
                                        <div class="cell-container">
                                            <div class="cell-view slds-text-align_right">
                                                <lightning-formatted-number
                                                        value={row.GrossRatePct__c}
                                                        minimum-fraction-digits="4"
                                                        maximum-fraction-digits="4">
                                                </lightning-formatted-number>
                                            </div>

                                            <template if:true={row._showEdit}>
                                                <div class="edit-icon-wrap">
                                                    <lightning-button-icon
                                                            icon-name="utility:edit"
                                                            size="small"
                                                            variant="bare"
                                                            data-key={row.key}
                                                            onclick={handleEditRow}
                                                            disabled={isEditDisabled}>
                                                    </lightning-button-icon>
                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <template if:true={row._isEditing}>
                                        <lightning-input
                                                label="GrossRatePct"
                                                variant="label-hidden"
                                                value={row.GrossRatePct__c}
                                                data-key={row.key}
                                                data-field="GrossRatePct__c"
                                                onchange={handleExistingRowChange}
                                                disabled={row._isRowEditDisabled}>
                                        </lightning-input>
                                    </template>
                                </td>

                                <!-- DP -->
                                <td class={row._tdClasses.DPPct__c}
                                      onmouseenter={handleRowHover}
                                      onmouseleave={handleRowLeave}
                                      data-key={row.key}>

                                    <template if:false={row._isEditing}>
                                        <div class="cell-container">
                                            <div class="cell-view slds-text-align_right">
                                                <lightning-formatted-number value={row.DPPct__c}>
                                                </lightning-formatted-number>
                                            </div>

                                            <template if:true={row._showEdit}>
                                                <div class="edit-icon-wrap">
                                                    <lightning-button-icon
                                                            icon-name="utility:edit"
                                                            size="small"
                                                            variant="bare"
                                                            data-key={row.key}
                                                            onclick={handleEditRow}
                                                            disabled={isEditDisabled}>
                                                    </lightning-button-icon>
                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <template if:true={row._isEditing}>
                                        <lightning-input
                                                label="DPPct"
                                                variant="label-hidden"
                                                value={row.DPPct__c}
                                                data-key={row.key}
                                                data-field="DPPct__c"
                                                onchange={handleExistingRowChange}
                                                disabled={row._isRowEditDisabled}>
                                        </lightning-input>
                                    </template>
                                </td>

                                <!-- Premium Currency -->
                                <td class={row._tdClasses.PremiumCurrency__c}
                                    onmouseenter={handleRowHover}
                                    onmouseleave={handleRowLeave}
                                    data-key={row.key}>

                                    <template if:false={row._isEditing}>
                                        <div class="cell-container slds-text-align_right">
                                            <span class="cell-view">{row.PremiumCurrency__c}</span>
                                            <template if:true={row._showEdit}>
                                                <lightning-button-icon
                                                        icon-name="utility:edit"
                                                        size="small"
                                                        variant="bare"
                                                        data-key={row.key}
                                                        onclick={handleEditRow}
                                                        disabled={isEditDisabled}>
                                                </lightning-button-icon>
                                            </template>
                                        </div>
                                    </template>

                                    <template if:true={row._isEditing}>
                                        <lightning-combobox
                                                data-key={row.key}
                                                data-field="PremiumCurrency__c"
                                                value={row.PremiumCurrency__c}
                                                class={row._premiumCurrencyClass}
                                                options={TSICurrencyOptions}
                                                onchange={handleComboboxChange}
                                                variant="label-hidden"
                                                dropdown-alignment="auto"
                                                disabled={row._isRowEditDisabled}>
                                        </lightning-combobox>
                                    </template>
                                </td>

                                <!-- FX Rate to Prem Currency -->
                                <td class={row._tdClasses.FxRatePremCurrency__c}
                                    onmouseenter={handleRowHover}
                                    onmouseleave={handleRowLeave}
                                    data-key={row.key}>

                                    <template if:false={row._isEditing}>
                                        <div class="cell-container">
                                            <div class="cell-view slds-text-align_right">
                                                <lightning-formatted-number value={row.FxRatePremCurrency__c}>
                                                </lightning-formatted-number>
                                            </div>

                                            <template if:true={row._showEdit}>
                                                <div class="edit-icon-wrap">
                                                    <lightning-button-icon
                                                            icon-name="utility:edit"
                                                            size="small"
                                                            variant="bare"
                                                            data-key={row.key}
                                                            onclick={handleEditRow}
                                                            disabled={isEditDisabled}>
                                                    </lightning-button-icon>
                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <template if:true={row._isEditing}>
                                        <div class={row._fxRatePremClass}>
                                            <lightning-input
                                                    label="FxRatePremCurrency"
                                                    variant="label-hidden"
                                                    value={row.FxRatePremCurrency__c}
                                                    data-key={row.key}
                                                    data-field="FxRatePremCurrency__c"
                                                    onchange={handleExistingRowChange}
                                                    disabled={row._isFxDisabledFinal}>
                                            </lightning-input>
                                        </div>
                                    </template>
                                </td>
                                <!-- Gross Prem (Before DP) -->
<!--                                <td><span class="cell-view">{row.GrossPremBfDP_fm__c}</span></td>-->
                                <td class="slds-text-align_right"><lightning-formatted-number value={row.GrossPremBfDP_fm__c}></lightning-formatted-number></td>
                                <!-- Gross Prem -->
<!--                                <td><span class="cell-view">{row.GrossPrem_fm__c}</span></td>-->
                                <td class="slds-text-align_right"><lightning-formatted-number value={row.GrossPrem_fm__c}></lightning-formatted-number></td>
                            </tr>
                        </template>

                        <template for:each={newRows} for:item="row" for:index="index">
                            <tr key={row.key} class="new-row">
                                <td>
                                    <lightning-input
                                            label="checkBox"
                                            variant="label-hidden"
                                            type="checkbox"
                                            data-key={row.key}
                                            checked={row._isChecked}
                                            onchange={handleNewRowCheck}
                                            disabled={isEditDisabled}>
                                    </lightning-input>
                                </td>
                                <td>{row.no}</td>
                                <td>
                                    <div class={row._nameClass}>
                                        <lightning-input
                                                label="Name"
                                                variant="label-hidden"
                                                data-key={row.key}
                                                data-field="LocationName__c"
                                                value={row.LocationName__c}
                                                onchange={handleNewRowChange}
                                                disabled={isEditDisabled}>
                                        </lightning-input>
                                    </div>
                                </td>

                                <td class="slds-text-align_center">
                                    <lightning-combobox
                                            data-key={row.key}
                                            data-field="UnamedLocation__c"
                                            value={row.UnamedLocation__c}
                                            options={undefinedOptions}
                                            onchange={handleNewRowChange}
                                            disabled={isEditDisabled}>
                                    </lightning-combobox>
                                </td>

                                <td>
                                    <lightning-input
                                            label="Search"
                                            variant="label-hidden"
                                            type="search"
                                            placeholder="Search address"
                                            data-key={row.key}
                                            onchange={handleAddressSearch}
                                            disabled={row._isAddressDisabledFinal}>
                                    </lightning-input>

                                    <div>
                                        <lightning-input-address
                                                street-label="Street"
                                                city-label="City"
                                                province-label="State"
                                                postal-code-label="Postal Code"
                                                country-label="Country"
                                                street={row.Address__c.street}
                                                city={row.Address__c.city}
                                                province={row.Address__c.state}
                                                postal-code={row.Address__c.postalCode}
                                                country={row.Address__c.country}
                                                data-key={row.key}
                                                onchange={handleAddressChange}
                                                disabled={row._isAddressDisabledFinal}>
                                        </lightning-input-address>
                                    </div>
                                </td>
                                <td>
                                    <lightning-input
                                            label="Latitude"
                                            variant="label-hidden"
                                            data-key={row.key}
                                            data-field="GPSCoordinates__Latitude__s"
                                            value={row.GPSCoordinates__Latitude__s}
                                            onchange={handleNewRowChange}
                                            disabled={row._isLatLngDisabledFinal}>
                                    </lightning-input>
                                </td>

                                <td>
                                    <lightning-input
                                            label="Longitude"
                                            variant="label-hidden"
                                            data-key={row.key}
                                            data-field="GPSCoordinates__Longitude__s"
                                            value={row.GPSCoordinates__Longitude__s}
                                            onchange={handleNewRowChange}
                                            disabled={row._isLatLngDisabledFinal}>
                                    </lightning-input>
                                </td>

                                <td>
                                    <lightning-input
                                            label="PostalCode"
                                            variant="label-hidden"
                                            data-key={row.key}
                                            data-field="postalCode"
                                            value={row.Address__c.postalCode}
                                            onchange={handleNewRowChange}
                                            disabled={row._isAddressDisabledFinal}>
                                    </lightning-input>
                                </td>

                                <td>
                                    <div class={row._coveredClass}>
                                        <lightning-input
                                                label="CoveredSection"
                                                variant="label-hidden"
                                                data-key={row.key}
                                                data-field="CoveredSection__c"
                                                value={row.CoveredSection__c}
                                                onchange={handleNewRowChange}
                                                disabled={isEditDisabled}>
                                        </lightning-input>
                                    </div>
                                </td>

                                <td>
                                    <div class={row._assetClass}>
                                        <lightning-input
                                                label="Asset"
                                                variant="label-hidden"
                                                data-key={row.key}
                                                data-field="Asset__c"
                                                value={row.Asset__c}
                                                onchange={handleNewRowChange}
                                                disabled={isEditDisabled}>
                                        </lightning-input>
                                    </div>
                                </td>

                                <td>
                                    <div class={row._tsiCurrencyClass}>
                                        <lightning-combobox
                                                data-key={row.key}
                                                data-field="TSICurrency__c"
                                                value={row.TSICurrency__c}
                                                options={TSICurrencyOptions}
                                                onchange={handleComboboxChange}
                                                variant="label-hidden"
                                                dropdown-alignment="auto"
                                                disabled={isEditDisabled}>
                                        </lightning-combobox>
                                    </div>
                                </td>

                                <td>
                                    <div class={row._insuredClass}>
                                        <lightning-input
                                                label="InsuredAmount"
                                                variant="label-hidden"
                                                type="number"
                                                data-key={row.key}
                                                data-field="InsuredAmount__c"
                                                value={row.InsuredAmount__c}
                                                onchange={handleNewRowChange}
                                                disabled={isEditDisabled}>
                                        </lightning-input>
                                    </div>
                                </td>

                                <td>
                                    <div class={row._grossRatePctClass}>
                                        <lightning-input
                                                label="GrossRatePct"
                                                variant="label-hidden"
                                                step="0.0001"
                                                min="0"
                                                formatter="decimal"
                                                data-key={row.key}
                                                data-field="GrossRatePct__c"
                                                value={row.GrossRatePct__c}
                                                onchange={handleNewRowChange}
                                                disabled={isEditDisabled}>
                                        </lightning-input>
                                    </div>
                                </td>

                                <td>
                                    <div class={row._dppCtErrClass}>
                                        <lightning-input
                                                label="DPPct"
                                                variant="label-hidden"
                                                type="number"
                                                step="any"
                                                data-key={row.key}
                                                data-field="DPPct__c"
                                                value={row.DPPct__c}
                                                onchange={handleNewRowChange}
                                                disabled={isEditDisabled}>
                                        </lightning-input>
                                    </div>
                                </td>

                                <td>
                                    <lightning-combobox
                                            data-key={row.key}
                                            data-field="PremiumCurrency__c"
                                            value={row.PremiumCurrency__c}
                                            class={row._premiumCurrencyClass}
                                            options={TSICurrencyOptions}
                                            onchange={handleComboboxChange}
                                            variant="label-hidden"
                                            dropdown-alignment="auto"
                                            disabled={isEditDisabled}>
                                    </lightning-combobox>
                                </td>

                                <td>
                                    <div class={row._fxRatePremClass}>
                                        <lightning-input
                                                label="FxRatePremCurrency"
                                                variant="label-hidden"
                                                type="number"
                                                step="any"
                                                data-key={row.key}
                                                data-field="FxRatePremCurrency__c"
                                                value={row.FxRatePremCurrency__c}
                                                disabled={row._isFxDisabledFinal}
                                                onchange={handleNewRowChange}>
                                        </lightning-input>
                                    </div>
                                </td>
                                <td></td>
                                <td></td>
                            </tr>
                        </template>

                        <template if:true={showNoDataMessage}>
                            <c-com-no-records ></c-com-no-records>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

        <template if:true={showModal}>
            <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open slds-modal_large custom-modal-large">
                <div class="slds-modal__container custom-modal-container">
                    <!-- 헤더 -->
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                title="Close" onclick={handleCloseModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 class="slds-text-heading_medium slds-hyphenate">
                            <lightning-icon icon-name="doctype:excel" size="small" class="slds-m-right_x-small"></lightning-icon>
                            Edit Excel Data - {fileName}
                        </h2>
                    </header>

                    <!-- 본문 -->
                    <div class="slds-modal__content slds-p-around_medium custom-modal-content" id="modal-content">
                        <c-opp-t-s-i-excel-upload
                                record-id={recordId}
                                slip-info-id={slipInfoId}
                                excel-data={excelData}
                                file-name={fileName}
                                onclose={handleCloseModal}
                                onsavecomplete={handleSaveComplete}>
                        </c-opp-t-s-i-excel-upload>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </div>
</template>
