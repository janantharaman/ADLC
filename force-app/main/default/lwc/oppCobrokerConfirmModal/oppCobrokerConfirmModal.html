<template>
    <!-- LK Type: Producing/Placing 충돌 테이블 -->
    <template if:true={isPlacingType}>
        <!-- Producing conflicts -->
        <template if:true={showProducingConflicts}>
            <div class="slds-text-title_bold slds-m-bottom_x-small">Producing</div>
            <div class="slds-scrollable slds-m-bottom_medium" style="max-height: 220px">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered" role="grid">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col">
                                <div class="slds-truncate slds-text-align_center" title={cobrokerNameLabel}>
                                    {cobrokerNameLabel}
                                </div>
                            </th>
                            <th scope="col">
                                <div class="slds-truncate slds-text-align_center" title={cobrokerContactLabel}>
                                    {cobrokerContactLabel}
                                </div>
                            </th>
                            <th scope="col">
                                <div class="slds-truncate slds-text-align_center" title={settlementTypeLabel}>
                                    {settlementTypeLabel}
                                </div>
                            </th>
                            <th scope="col">
                                <div class="slds-truncate slds-text-align_center" title={sharingPctLabel}>
                                    {sharingPctLabel}
                                </div>
                            </th>
                            <th scope="col">
                                <div class="slds-truncate slds-text-align_center" title={lkAdminFeePctLabel}>
                                    {lkAdminFeePctLabel}
                                </div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={producingConflicts} for:item="r">
                            <tr key={r.Id} class="slds-hint-parent">
                                <td role="gridcell">
                                    <div class="slds-truncate" title={r.CobrokerName_lk__r.Name}>
                                        {r.CobrokerName_lk__r.Name}
                                    </div>
                                </td>
                                <td role="gridcell">
                                    <div class="slds-truncate">
                                        <template if:true={r.CobrokerContact_lk__r}>
                                            <span title={r.CobrokerContact_lk__r.Name}
                                                >{r.CobrokerContact_lk__r.Name}</span
                                            >
                                        </template>
                                        <template if:false={r.CobrokerContact_lk__r}>
                                            <span>-</span>
                                        </template>
                                    </div>
                                </td>
                                <td role="gridcell">
                                    <div class="slds-truncate slds-text-align_center" title={r.SettlementType__c}>
                                        {r.SettlementType__c}
                                    </div>
                                </td>
                                <td role="gridcell">
                                    <div class="slds-truncate slds-text-align_right" title={r.SharingPct__c}>
                                        {r.SharingPct__c}%
                                    </div>
                                </td>
                                <td role="gridcell">
                                    <div class="slds-truncate slds-text-align_right" title={r.LKAdminFeePct__c}>
                                        {r.LKAdminFeePct__c}%
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>

        <!-- Placing Panel conflicts -->
        <template if:true={showPlacingConflicts}>
            <template if:true={hasPlacingPanelConflicts}>
                <div class="slds-text-title_bold slds-m-bottom_x-small">Placing - Market Line</div>
                <div class="slds-scrollable slds-m-bottom_medium" style="max-height: 220px">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered" role="grid">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col">
                                    <div class="slds-truncate slds-text-align_center" title={cobrokerUserLabel}>
                                        {cobrokerUserLabel}
                                    </div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate slds-text-align_center" title={settlementTypeLabel}>
                                        {settlementTypeLabel}
                                    </div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate slds-text-align_center" title={sharingPctLabel}>
                                        {sharingPctLabel}
                                    </div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate slds-text-align_center" title={tppAdminFeePctLabel}>
                                        {tppAdminFeePctLabel}
                                    </div>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={placingPanelConflicts} for:item="p">
                                <tr key={p.Id} class="slds-hint-parent">
                                    <td role="gridcell">
                                        <div class="slds-truncate" title={p.CoBroker_lk__r.Name}>
                                            {p.CoBroker_lk__r.Name}
                                        </div>
                                    </td>
                                    <td role="gridcell">
                                        <div class="slds-truncate slds-text-align_center" title={p.SettlementType__c}>
                                            {p.SettlementType__c}
                                        </div>
                                    </td>
                                    <td role="gridcell">
                                        <div class="slds-truncate slds-text-align_right" title={p.SharingPct__c}>
                                            {p.SharingPct__c}%
                                        </div>
                                    </td>
                                    <td role="gridcell">
                                        <div class="slds-truncate slds-text-align_right" title={p.TPPAdminFeePct__c}>
                                            {p.TPPAdminFeePct__c}%
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
        </template>
    </template>

    <!-- Placing Co-broking 테이블 -->
    <template if:true={showPlacingCobrokingTable}>
        <div class="slds-text-title_bold slds-m-bottom_x-small">Placing - Co-broking</div>
        <div class="slds-scrollable" style="max-height: 220px">
            <table class="slds-table slds-table_cell-buffer slds-table_bordered" role="grid">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col">
                            <div class="slds-truncate slds-text-align_center" title={cobrokerUserLabel}>
                                {cobrokerUserLabel}
                            </div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate slds-text-align_center" title={settlementTypeLabel}>
                                {settlementTypeLabel}
                            </div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate slds-text-align_center" title={sharingPctLabel}>
                                {sharingPctLabel}
                            </div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate slds-text-align_center" title={lkAdminFeePctLabel}>
                                {lkAdminFeePctLabel}
                            </div>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={fourColumnTableRecords} for:item="record">
                        <tr key={record.Id} class="slds-hint-parent">
                            <td role="gridcell">
                                <div class="slds-truncate" title={record.CobrokerUser_lk__r.Name}>
                                    {record.CobrokerUser_lk__r.Name}
                                </div>
                            </td>
                            <td role="gridcell">
                                <div class="slds-truncate slds-text-align_center" title={record.SettlementType__c}>
                                    {record.SettlementType__c}
                                </div>
                            </td>
                            <td role="gridcell">
                                <div class="slds-truncate slds-text-align_right" title={record.SharingPct__c}>
                                    {record.SharingPct__c}%
                                </div>
                            </td>
                            <td role="gridcell">
                                <div class="slds-truncate slds-text-align_right" title={record.LKAdminFeePct__c}>
                                    {record.LKAdminFeePct__c}%
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </template>

    <!-- Existing records 테이블 -->
    <template if:true={showExistingRecordsTable}>
        <div class="slds-scrollable" style="max-height: 300px">
            <table class="slds-table slds-table_cell-buffer slds-table_bordered" role="grid">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col">
                            <div class="slds-truncate slds-text-align_center" title={cobrokerUserLabel}>
                                {cobrokerUserLabel}
                            </div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate slds-text-align_center" title={settlementTypeLabel}>
                                {settlementTypeLabel}
                            </div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate slds-text-align_center" title={sharingPctLabel}>
                                {sharingPctLabel}
                            </div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate slds-text-align_center" title={lkAdminFeePctLabel}>
                                {lkAdminFeePctLabel}
                            </div>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={fourColumnTableRecords} for:item="record">
                        <tr key={record.Id} class="slds-hint-parent">
                            <td role="gridcell">
                                <div class="slds-truncate" title={record.CobrokerUser_lk__r.Name}>
                                    {record.CobrokerUser_lk__r.Name}
                                </div>
                            </td>
                            <td role="gridcell">
                                <div class="slds-truncate slds-text-align_center" title={record.SettlementType__c}>
                                    {record.SettlementType__c}
                                </div>
                            </td>
                            <td role="gridcell">
                                <div class="slds-truncate slds-text-align_right" title={record.SharingPct__c}>
                                    {record.SharingPct__c}%
                                </div>
                            </td>
                            <td role="gridcell">
                                <div class="slds-truncate slds-text-align_right" title={record.LKAdminFeePct__c}>
                                    {record.LKAdminFeePct__c}%
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </template>
</template>
