<template>
    <div lwc:if={isLoading} class="spinner">
        <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
    </div>

    <lightning-modal-header label={modalHeader}></lightning-modal-header>
    <lightning-modal-body>
        <div lwc:if={isInsuranceFeatureDisabled}>
            <span>이 기능은 UAT 범위가 아니며, 현재 개발중입니다.</span>
        </div>
        <div class="container" lwc:else>
            <!-- ACTION -->
            <div class="slds-float_right slds-p-bottom_x-small">
                <lightning-button
                    lwc:if={showNewButton}
                    name="action_New"
                    label="New"
                    icon-name="utility:add"
                    variant="brand"
                    disabled={isNewDisabled}
                    onclick={handleNewClick}
                ></lightning-button>

                <lightning-input
                    lwc:if={showFileUpload}
                    type="file"
                    label="Upload Statement"
                    accept=".xlsx,.csv"
                    disabled={isStatementUploadDisabled}
                    onchange={handleFileChange}
                ></lightning-input>
            </div>

            <!-- TABLE -->
            <c-rec-table
                key-field="Id"
                columns={tableColumns}
                data={tableData}
                hide-checkbox-column="true"
                oncellbuttonclick={handleCellButtonClick}
            >
            </c-rec-table>
        </div>
    </lightning-modal-body>
</template>
