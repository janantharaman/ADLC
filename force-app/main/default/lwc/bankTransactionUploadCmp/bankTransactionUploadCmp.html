<template>
    <div class="slds-var-p-around_medium">
        <lightning-input type="file" accept=".xlsx, .csv" label={label.fileUploadExt} onchange={handleFileChange}>
        </lightning-input>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text={label.processing}></lightning-spinner>
        </template>

        <template lwc:if={isDataAvailable}>
            <lightning-button-group class="slds-float_right">
                <lightning-button label={label.removeData} onclick={clearPreview}></lightning-button>
                <lightning-button
                    variant="brand"
                    label={label.upload}
                    onclick={handleUploadClick}
                    disabled={isUploaded}
                ></lightning-button>
            </lightning-button-group>

            <h3 class="slds-text-heading_small slds-m-top_medium">{label.preview}</h3>
            <div class="datatable-container">
                <lightning-datatable
                    key-field="__rowKey"
                    data={previewData}
                    hide-checkbox-column
                    column-widths-mode="auto"
                    columns={previewColumns}
                    sorted-direction={sortDirection}
                    sorted-by={sortedBy}
                    onsort={handleSort}
                ></lightning-datatable>
            </div>
        </template>
        <hr />
        <template if:true={errors.length}>
            <h3 class="slds-text-heading_small slds-m-top_medium">{label.errorsTitle}</h3>
            <div class="datatable-container">
                <lightning-datatable
                    key-field="rowNumber"
                    wrap-text-max-lines="3"
                    data={errors}
                    hide-checkbox-column
                    column-widths-mode="auto"
                    columns={errorColumns}
                >
                </lightning-datatable>
            </div>
        </template>

        <template if:true={duplicateBankRowsForDisplay.length}>
            <h3 class="slds-text-heading_small slds-m-top_medium">{label.bankDupSuspect}</h3>
            <div class="datatable-container" data-id="duplicateBankTable">
                <lightning-datatable
                    key-field="rowNumber"
                    data={duplicateBankRowsForDisplay}
                    hide-checkbox-column
                    column-widths-mode="auto"
                    columns={previewColumns}
                >
                </lightning-datatable>
            </div>
        </template>
    </div>

    <!-- Bank Account Selection Modal -->
    <template if:true={showBankAccountModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title slds-hyphenate">{label.bankAccountSelect}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-record-edit-form object-api-name="BankTransaction__c">
                        <lightning-input-field
                            field-name="BankAccount__c"
                            value={selectedBankAccountId}
                            onchange={handleBankAccountChange}
                        ></lightning-input-field>
                    </lightning-record-edit-form>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={handleBankAccountCancel}>{label.cancel}</button>
                    <button class="slds-button slds-button_brand" onclick={handleBankAccountSave} disabled={isSaveDisabled}>
                        {label.save}
                    </button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Bank Transaction Confirmation Modal -->
    <template if:true={showBankTransactionConfirmation}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title slds-hyphenate">{label.duplicateCheck}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>{duplicateAskMessageString}</p>
                </div>
                <footer class="slds-modal__footer slds-modal__footer_directional">
                    <button class="slds-button slds-button_neutral" onclick={handleShowDuplicates}>
                        {label.btnShowDupData}
                    </button>
                    <button class="slds-button slds-button_neutral" onclick={handleUploadWithoutDuplicates}>
                        {label.btnExcDupUpload}
                    </button>
                    <button class="slds-button slds-button_brand" onclick={handleUploadWithDuplicates}>
                        {label.btnUploadAll}
                    </button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
