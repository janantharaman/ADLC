<template>
    <template if:false={multi}>
        <div class="slds-combobox_container slds-is-relative">
            <div class={comboboxClass} style="position: relative; width: 100%">
                <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                    <input
                            class="slds-input slds-combobox__input"
                            type="text"
                            placeholder={placeholder}
                            value={displayValue}
                            aria-label={label}
                            disabled={disabled}
                            required={required}
                            readonly
                            onclick={toggleDropdown}
                            onblur={handleBlur}
                            role="combobox"
                            aria-expanded={isOpen}
                            aria-haspopup="listbox"
                    />
                    <lightning-icon
                            class="slds-input__icon slds-input__icon_right"
                            icon-name="utility:down"
                            size="x-small"
                            onclick={toggleDropdown}
                    >
                    </lightning-icon>
                </div>
                <template if:true={isOpen}>
                    <div class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid"
                         role="listbox"
                         style="z-index: 9999; background-color: white;"
                         onmousedown={handleDropdownMouseDown}>
                        <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                            <template for:each={optionList} for:item="o">
                                <li key={o.value} class="slds-listbox__item" role="presentation">
                                    <div class={o.itemClass}
                                         role="option"
                                         data-value={o.value}
                                         onclick={handleOptionClick}>
                                      <span class="slds-media__figure slds-listbox__option-icon">
                                          <template if:true={o.selected}>
                                              <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                                          </template>
                                      </span>
                                        <span class="slds-media__body">
                                          <span class="slds-truncate">{o.label}</span>
                                      </span>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>
            </div>
        </div>

        <!--        <lightning-combobox-->
<!--                label={label}-->
<!--                variant="label-hidden"-->
<!--                value={value}-->
<!--                options={options}-->
<!--                placeholder={placeholder}-->
<!--                disabled={disabled}-->
<!--                required={required}-->
<!--                onchange={handleSingleChange}>-->
<!--        </lightning-combobox>-->
    </template>

    <template if:true={multi}>
        <lightning-dual-listbox
                size={multiRowCnt}
                label=""
                variant="label-hidden"
                source-label="Available"
                selected-label="Selected"
                options={options}
                value={values}
                disabled={disabled}
                required={required}
                onchange={handleMultiChange}>
        </lightning-dual-listbox>
    </template>
</template>
