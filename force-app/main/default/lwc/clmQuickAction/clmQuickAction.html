<template>
    <!-- ===== PLA_SOC_ISSUE 모드: 문서 생성 ===== -->
    <template if:true={isPLASOCMode}>
        <lightning-quick-action-panel header={labels.header} class="small">
            <div class="slds-text-align_center slds-var-p-vertical_medium">
                <template if:true={showSpinner}>
                    <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
                </template>

                <template if:false={showSpinner}>
                    <template if:true={showPermissionError}>
                        <p class="slds-text-color_error slds-text-body_regular">{labels.permissionError}</p>
                    </template>

                    <template if:true={showAllocationError}>
                        <p class="slds-text-color_error slds-text-body_regular">{labels.allocationIncomplete}</p>
                    </template>

                    <template if:true={showBusinessError}>
                        <p class="slds-text-color_error slds-text-body_regular">{labels.totalAmtMismatch}</p>
                    </template>

                    <template if:true={showConfirmMessage}>
                        <p class="slds-text-body_small slds-text-color_weak">{labels.confirmSubMessage}</p>
                    </template>
                </template>
            </div>

            <div slot="footer">
                <lightning-button label={labels.cancel} onclick={handleClose}></lightning-button>

                <template if:false={isGenerateHidden}>
                    <lightning-button class="slds-var-m-left_x-small" variant="brand" label={labels.generate} onclick={handleGenerate}></lightning-button>
                </template>
            </div>
        </lightning-quick-action-panel>
    </template>
</template>
