<template>
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
    </template>
    <template if:true={hasError}>
        <div class="slds-truncate slds-align_absolute-center slds-p-around_large slds-text-color_error slds-text-heading_medium ">{errorMsg}</div>
    </template>
    <template if:false={hasError}>

    <!-- 1. Summary (상단 요약) -->
    <div class="slds-p-around_small">
        <c-clm-soc-pla-allocation-summary
                record-id={recordId}
                records={computedSummaryData}
                errors={summaryErrors}
        >
        </c-clm-soc-pla-allocation-summary>
    </div>

    <!-- 2. Input Form & Actions (입력 및 버튼) -->
    <div class="slds-card slds-m-top_small">
        <div class="slds-card__body slds-card__body_inner">
            <!-- 전체를 감싸는 Layout (Input 10 : Button 2) -->
            <lightning-layout vertical-align="end">

                <!-- Input Area (10/12) -->
                <lightning-layout-item size="10">
                    <lightning-layout multiple-rows>
                        <!-- Type (SOC/PLA) -->
                        <lightning-layout-item class="slds-p-horizontal_xx-small" size="12" small-device-size="6" medium-device-size="3">
                            <lightning-combobox
                                name="type"
                                label={labelType}
                                variant="label-stacked"
                                value={inputType}
                                disabled={isDisabled}
                                options={ClaimOptions}
                                onchange={handleInputChange}
                                required
                            ></lightning-combobox>
                        </lightning-layout-item>

                        <!-- Loss Amount -->
                        <lightning-layout-item class="slds-p-horizontal_xx-small" size="12" small-device-size="6" medium-device-size="3">
                            <lightning-input
                                type="number"
                                name="loss"
                                label={labelLoss}
                                variant="label-stacked"
                                class="cus-lk-input-right"
                                disabled={isAmountDisabled}
                                value={amounts.loss}
                                onchange={handleAmountChange}
                                onkeydown={handleKeyDown}
                                step={stepValue}
                                required
                            ></lightning-input>
                        </lightning-layout-item>

                        <!-- Expense Amount -->
                        <lightning-layout-item class="slds-p-horizontal_xx-small" size="12" small-device-size="6" medium-device-size="3">
                            <lightning-input
                                type="number"
                                name="expense"
                                label={labelExpense}
                                variant="label-stacked"
                                class="cus-lk-input-right"
                                value={amounts.expense}
                                disabled={isAmountDisabled}
                                onchange={handleAmountChange}
                                onkeydown={handleKeyDown}
                                step={stepValue}
                                required
                            ></lightning-input>
                        </lightning-layout-item>

                        <!-- Total Amount -->
                        <lightning-layout-item class="slds-p-horizontal_xx-small" size="12" small-device-size="6" medium-device-size="3">
                            <lightning-input
                                type="number"
                                name="total"
                                label={labelTotal}
                                variant="label-stacked"
                                class="cus-lk-input-right"
                                value={amounts.total}
                                read-only
                                step={stepValue}
                            ></lightning-input>
                        </lightning-layout-item>
                    </lightning-layout>
                </lightning-layout-item>

                <!-- Button Area (2/12) -->
                <lightning-layout-item size="2" class="slds-text-align_right slds-p-bottom_xx-small">
                    <lightning-button-group >
                        <lightning-button
                            label="Allocation"
                            variant="brand-outline"
                            onclick={handleAllocate}
                            disabled={isAllocationDisabled}
                        ></lightning-button>
                        <lightning-button
                            label="Save"
                            variant="brand"
                            onclick={handleSave}
                            disabled={isSaveDisabled}
                        ></lightning-button>
                    </lightning-button-group>
                </lightning-layout-item>

            </lightning-layout>
        </div>
    </div>

    <!-- 3. Source Grid (대상 선택) -->
    <div class="slds-card slds-m-top_small">
        <c-opp-producing-co-broking-single record-id={recordId}>
        </c-opp-producing-co-broking-single>
    </div>
    <div class="slds-card slds-m-top_small">
        <c-opp-l-k-co-broking record-id={recordId} >
        </c-opp-l-k-co-broking >
    </div>

    <!-- 3. Source Grid (대상 선택) -->
    <div class="slds-card slds-m-top_small">
        <c-opp-market-line-manage
                record-id={recordId}
        ></c-opp-market-line-manage>
    </div>

    <!-- 4. Result Grid (결과 미리보기) -->
    <div class="slds-box slds-m-top_small">
        <c-clm-soc-pla-allocation-line-items
                is-disabled={isDisabled}
                items={resultItems}
                claim-currency={claimCurrency}
                ondelete={handleResultDelete}
                onrefresh={handleRefresh}
        ></c-clm-soc-pla-allocation-line-items>
    </div>
    </template>
</template>
