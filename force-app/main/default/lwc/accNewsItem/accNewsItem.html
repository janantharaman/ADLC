<template>
    <div class="news-item slds-p-vertical_x-small slds-border_bottom">
        <a href={news.OriginalLink__c}
           data-url={news.OriginalLink__c}
           onclick={handleOpenLink}
           class="news-title slds-text-link">
            {news.Title__c}
        </a>
        <p class="news-description slds-text-body_small slds-m-top_xx-small">
            {news.Description__c}
        </p>
        <span class="news-date slds-text-color_weak slds-text-body_small">
              {news.formattedDate}
        </span>
    </div>
</template>
