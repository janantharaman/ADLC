<!-- Opp Slip Info RI Closing Modal -->
<template>
    <lightning-quick-action-panel header="RI Closing Slip">

        <template if:true={showOmniScript}>
            <div class="slds-p-around_medium">
                <lightning-omnistudio-omniscript
                        type="RIClosing"
                        sub-type="SlipInfo"
                        language="English"
                        prefill={seedDataJson}
                        oncomplete={handleOmniComplete}
                ></lightning-omnistudio-omniscript>
            </div>
        </template>

        <template if:false={showOmniScript}>
            <div class="slds-p-around_medium">
                <template if:true={isValidated}>

                    <template if:false={hasMismatch}>
                        <div class="slds-text-align_center slds-m-bottom_medium">
                            현재 RI Closing Slip 데이터로 문서를 생성합니다.
                        </div>

                        <div class="slds-text-align_center">
                            진행 하시겠습니까?
                        </div>
                    </template>

                    <template if:true={hasMismatch}>
                        <div class="slds-box slds-m-bottom_small errorBox slds-text-align_center">

                            <div class="slds-text-color_error slds-text-title_bold">
                                아래 항목이 {compareTarget} 와 일치하지 않습니다:
                            </div>

                            <ul class="slds-text-color_error slds-m-top_x-small">
                                <template for:each={mismatchFields} for:item="f">
                                    <li key={f}>• {f}</li>
                                </template>
                            </ul>

                        </div>
                    </template>
                </template>
            </div>

            <div slot="footer">
                <lightning-button
                        label="Cancel"
                        onclick={handleCancel}>
                </lightning-button>

                <lightning-button
                        variant="brand"
                        label="Confirm"
                        class="slds-m-left_small"
                        onclick={handleConfirm}
                        disabled={isConfirmDisabled}>
                </lightning-button>
            </div>
            </template>

    </lightning-quick-action-panel>
</template>
