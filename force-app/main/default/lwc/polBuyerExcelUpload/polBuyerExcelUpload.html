<template>
    <lightning-card title="POL Buyer Excel Upload" icon-name="custom:custom63">
        <div class="slds-p-around_medium">
            <!-- Template Download Button -->
            <div class="slds-m-bottom_medium">
                <lightning-button
                    label="Download Template"
                    icon-name="utility:download"
                    onclick={handleTemplateExport}
                    variant="neutral"
                >
                </lightning-button>
            </div>

            <!-- File Upload Section -->
            <div class="slds-form-element">
                <label class="slds-form-element__label" for="file-upload">
                    <abbr class="slds-required" title="required">* </abbr>
                    Upload Excel File
                </label>
                <div class="slds-form-element__control">
                    <input
                        type="file"
                        id="file-upload"
                        accept=".xlsx, .xls"
                        onchange={handleFileChange}
                        class="slds-file-selector__input slds-assistive-text"
                    />
                    <label class="slds-file-selector__body" for="file-upload">
                        <span class="slds-file-selector__button slds-button slds-button_neutral">
                            <lightning-icon
                                icon-name="utility:upload"
                                size="x-small"
                                class="slds-m-right_x-small"
                            ></lightning-icon>
                            Upload Files
                        </span>
                        <span class="slds-file-selector__text slds-medium-show">or Drop Files</span>
                    </label>
                </div>
                <div class="slds-form-element__help slds-m-top_x-small">Supported formats: .xlsx, .xls</div>
            </div>

            <!-- Instructions -->
            <div class="slds-box slds-box_x-small slds-theme_shade slds-m-top_medium">
                <p class="slds-text-heading_small slds-m-bottom_x-small">Excel File Format:</p>
                <ul class="slds-list_dotted">
                    <li>
                        <strong>56 columns</strong> including Company name, International business name, EASY No.,
                        Address, etc.
                    </li>
                    <li><strong>Required fields:</strong> Based on field configuration</li>
                    <li><strong>Date fields:</strong> Request date, Decision date, Effect date, End date</li>
                    <li>
                        <strong>Number fields:</strong> Amount asked, Minimum shipment amount, Amount agreed, Insured
                        percentage, Internal credit limit
                    </li>
                </ul>
                <p class="slds-m-top_small slds-text-body_small">
                    <lightning-icon
                        icon-name="utility:info"
                        size="xx-small"
                        class="slds-m-right_xx-small"
                    ></lightning-icon>
                    Download the template to see the exact format required.
                </p>
            </div>
        </div>
    </lightning-card>

    <!-- SLDS Modal (ExcelDataGrid 스타일) -->
    <template if:true={showModal}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            class="slds-modal slds-fade-in-open slds-modal_large custom-modal-large"
        >
            <div class="slds-modal__container custom-modal-container">
                <!-- 헤더 -->
                <header class="slds-modal__header">
                    <button
                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close"
                        onclick={handleCloseModal}
                    >
                        <lightning-icon
                            icon-name="utility:close"
                            alternative-text="close"
                            size="small"
                        ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate">
                        <lightning-icon
                            icon-name="doctype:excel"
                            size="small"
                            class="slds-m-right_x-small"
                        ></lightning-icon>
                        Edit Excel Data - {fileName}
                    </h2>
                </header>

                <!-- 본문 -->
                <div class="slds-modal__content slds-p-around_medium custom-modal-content" id="modal-content">
                    <c-pol-buyer-excel-grid
                        record-id={recordId}
                        excel-data={excelData}
                        file-name={fileName}
                        onclose={handleCloseModal}
                        onsavecomplete={handleSaveComplete}
                    >
                    </c-pol-buyer-excel-grid>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
