<template>
    <!--
        url type: displayValue as link text, href computed by recTable.
        Opens in a new tab.
        - config.urlField      → row[urlField] used as href (full URL)
        - config.idField + objectApiName → /lightning/r/{objectApiName}/{id}/view
        - neither set          → cell value itself used as href
        Falls back to plain text when href is empty / null.
    -->
    <template if:true={urlHref}>
        <a
            href={urlHref}
            target="_blank"
            rel="noopener noreferrer"
            class="slds-truncate rec-table__cell-url"
            title={displayValue}
            >{displayValue}</a
        >
    </template>
    <template if:false={urlHref}>
        <span class="slds-truncate" title={displayValue}>{displayValue}</span>
    </template>
</template>
