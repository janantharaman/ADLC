<template>
    <div class="slds-var-p-around_medium">
        <lightning-input type="file" accept=".xlsx, .csv" label={label.fileUploadExt} onchange={handleFileChange}>
        </lightning-input>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text={label.processing}></lightning-spinner>
        </template>

        <template lwc:if={isDataAvailable}>
            <div>
                <h3 class="slds-text-heading_medium slds-m-top_medium">{label.preview}</h3>
            </div>
            <div class="slds-text-align_right slds-p-bottom_x-small">
                <lightning-button-group>
                    <lightning-button label={label.removeData} onclick={clearPreview}></lightning-button>
                    <lightning-button
                        variant="brand"
                        label={label.upload}
                        onclick={handleUploadClick}
                        disabled={isUploaded}
                    ></lightning-button>
                </lightning-button-group>
            </div>
            <div class="datatable-container">
                <lightning-datatable
                    key-field="__rowKey"
                    data={previewData}
                    hide-checkbox-column
                    column-widths-mode="auto"
                    columns={previewColumns}
                    sorted-direction={sortDirection}
                    sorted-by={sortedBy}
                    onsort={handleSort}
                    >></lightning-datatable
                >
            </div>
        </template>
        <hr />
        <template if:true={errors.length}>
            <h3 class="slds-text-heading_small slds-m-top_medium">{label.errorsTitle}</h3>
            <div class="datatable-container">
                <lightning-datatable
                    key-field="rowNumber"
                    wrap-text-max-lines="3"
                    data={errors}
                    hide-checkbox-column
                    column-widths-mode="auto"
                    columns={errorColumns}
                >
                </lightning-datatable>
            </div>
        </template>
    </div>

    <!-- Exchange Rate Confirmation Modal -->
    <template if:true={showExchangeRateConfirmation}>
        <section role="dialog" tabindex="-1" aria-modal="true" class={modalSizeClass}>
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title slds-hyphenate">{label.duplicateCheck}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p class="slds-m-bottom_small">{duplicateMessage}</p>
                    <template if:true={duplicateRows.length}>
                        <lightning-datatable
                            key-field="__rowKey"
                            data={duplicateRows}
                            columns={previewColumns}
                            hide-checkbox-column
                            column-widths-mode="auto"
                        ></lightning-datatable>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={handleModalCancel}>{label.cancel}</button>
                    <button class="slds-button slds-button_brand" onclick={handleModalConfirm}>{label.upload}</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <!-- Upload Result Modal -->
    <template lwc:if={showResultModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">
                <div class={resultModalContentClass} style="border-radius: 0.25rem">
                    <button
                        class="slds-button slds-button_icon slds-button_icon-inverse"
                        style="position: absolute; right: 0.5rem; top: 0.5rem; z-index: 10"
                        title={label.closeBtn}
                        onclick={handleCloseResultModal}
                    >
                        <lightning-icon
                            icon-name="utility:close"
                            alternative-text={label.closeBtn}
                            variant="inverse"
                            size="small"
                        ></lightning-icon>
                        <span class="slds-assistive-text">{label.closeBtn}</span>
                    </button>
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name={resultModalIconName} variant="inverse" size="medium"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <h2 class="slds-text-heading_medium slds-m-bottom_small">
                                <strong>{uploadResultDetails.title}</strong>
                            </h2>
                            <ul class="slds-list_dotted slds-text-body_regular" style="font-size: 14px">
                                <li>{label.resultTotal}: {uploadResultDetails.total}</li>
                                <li>{label.resultCreated}: {uploadResultDetails.created}</li>
                                <li>{label.resultDuplicates}: {uploadResultDetails.duplicate}</li>
                                <li>{label.resultErrors}: {uploadResultDetails.error}</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
