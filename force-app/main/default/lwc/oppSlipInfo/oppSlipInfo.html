<template>
    <lightning-card>
        <div class="content-70">
            <div class="slds-p-left_medium slds-p-top_medium slds-p-bottom_medium slds-p-right_none">

                <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small slds-p-bottom_small slds-border_bottom">

                    <!-- Title (Left) -->
                    <div class="slds-col slds-grow slds-text-heading_small slds-truncate" title={slipTitle}>
                        <strong>{slipTitle}</strong>
                    </div>

                    <!-- Buttons (Right) -->
                    <div class="slds-col slds-col_bump-left slds-grid slds-grid_vertical-align-center slds-grid_align-end slds-p-right_none">
                        <!-- Offer / Closing Upload + Generate 버튼 (Opportunity / Placement 페이지) -->
                        <template if:true={showUploadButton}>

                            <!-- SlipInfo 없거나 있음 + Edit 모드 아닌 경우 -->
                            <template if:true={showOpportunityNoSlipInfo}>
                                <lightning-button label="New" variant="brand" class="slds-m-left_x-small" disabled={isHeaderActionDisabled} onclick={handleNewSlipInfo}></lightning-button>
                                <template if:true={showOfferClosingUpload}>
                                    <lightning-button label={labels.offerUpload} variant="brand-outline" class="slds-m-left_x-small" disabled={isUploadDisabled} onclick={handleOfferUpload}></lightning-button>
                                    <lightning-button label={labels.closingUpload} variant="brand-outline" class="slds-m-left_x-small" disabled={isUploadDisabled} onclick={handleClosingUpload}></lightning-button>
                                </template>
                                <lightning-button label={labels.generateRIOffer} variant="brand-outline" class="slds-m-left_x-small" disabled={isHeaderActionDisabled} onclick={handleGenerateRIOffer}></lightning-button>
                                <lightning-button label={labels.generateRIClosing} variant="brand-outline" class="slds-m-left_x-small" disabled={isHeaderActionDisabled} onclick={handleGenerateRIClosingOffer}></lightning-button>
                            </template>

                            <!-- Opportunity 신규 SlipInfo 생성 모드 -->
                            <template if:true={showOpportunityCreateMode}>
                                <lightning-button-group>
                                    <lightning-button label={labels.cancel} variant="neutral" disabled={isHeaderSaveDisabled} onclick={handleCancel}></lightning-button>
                                    <lightning-button label={labels.save} variant="brand" disabled={isHeaderSaveDisabled} onclick={handleSave}></lightning-button>
                                </lightning-button-group>
                            </template>

                            <template if:true={showOpportunityWithSlipInfo}>
                                <lightning-button-group>
                                    <lightning-button label="New" variant="neutral" disabled={isHeaderActionDisabled} onclick={handleNewSlipInfo}></lightning-button>
                                    <lightning-button label={labels.edit} variant="brand" disabled={isHeaderEditDisabled} onclick={handleEditMode}></lightning-button>
                                </lightning-button-group>
                                <template if:true={showOfferClosingUpload}>
                                    <lightning-button label={labels.offerUpload} variant="brand-outline" class="slds-m-left_x-small" disabled={isUploadDisabled} onclick={handleOfferUpload}></lightning-button>
                                    <lightning-button label={labels.closingUpload} variant="brand-outline" class="slds-m-left_x-small" disabled={isUploadDisabled} onclick={handleClosingUpload}></lightning-button>
                                </template>
                                <lightning-button label={labels.generateRIOffer} variant="brand-outline" class="slds-m-left_x-small" disabled={isHeaderActionDisabled} onclick={handleGenerateRIOffer}></lightning-button>
                                <lightning-button label={labels.generateRIClosing} variant="brand-outline" class="slds-m-left_x-small" disabled={isHeaderActionDisabled} onclick={handleGenerateRIClosingOffer}></lightning-button>
                            </template>

                            <template if:true={showOpportunityEditMode}>
                                <lightning-button-group>
                                    <lightning-button label={labels.cancel} variant="neutral" disabled={isHeaderSaveDisabled} onclick={handleCancel}></lightning-button>
                                    <lightning-button label={labels.save} variant="brand" disabled={isHeaderSaveDisabled} onclick={handleSave}></lightning-button>
                                </lightning-button-group>
                            </template>

                            <!-- Placement 페이지 -->
                            <template if:true={showPlacementNoSlipInfo}>
                                    <lightning-button label={labels.save} variant="brand" disabled={isHeaderSaveDisabled} onclick={handleSave}></lightning-button>
                            </template>

                            <template if:true={showPlacementWithSlipInfo}>
                                <lightning-button-group>
                                    <lightning-button label="New" variant="neutral" disabled={isHeaderActionDisabled} onclick={handleNewSlipInfo}></lightning-button>
                                    <lightning-button label={labels.edit} variant="brand" disabled={isHeaderEditDisabled} onclick={handleEditMode}></lightning-button>
                                </lightning-button-group>
                                <template if:false={showGenerateRIEndButton}>
                                    <lightning-button label="Cedant Closing Slip Upload" variant="brand-outline" class="slds-m-left_x-small" disabled={isUploadDisabled} onclick={handleClosingUploadByPlacement}></lightning-button>
                                    <lightning-button label={labels.generateRIOffer} variant="brand-outline" class="slds-m-left_x-small" onclick={handleGenerateRIOffer}></lightning-button>
                                    <lightning-button label={labels.generateRIClosing} variant="brand-outline" class="slds-m-left_x-small" onclick={handleGenerateRIClosingOfferByPlacement}></lightning-button>
                                </template>
                                <template if:true={showGenerateRIEndButton}>
                                    <lightning-button label={labels.generateRIEND} variant="brand-outline" class="slds-m-left_x-small" onclick={handleGenerateRIEndByPlacement}></lightning-button>
                                </template>
                            </template>

                            <template if:true={showPlacementEditMode}>
                                <lightning-button-group>
                                    <lightning-button label={labels.cancel} variant="neutral" disabled={isHeaderSaveDisabled} onclick={handleCancel}></lightning-button>
                                    <lightning-button label={labels.save} variant="brand" disabled={isHeaderSaveDisabled} onclick={handleSave}></lightning-button>
                                </lightning-button-group>
                            </template>

                            <!-- Flow Modal (Opportunity / Placement 공통) -->
                            <template if:true={showFlowModal}>
                                <section role="dialog" class="slds-modal slds-fade-in-open">
                                    <div class="slds-modal__container">
                                        <header class="slds-modal__header">
                                            <h2 class="slds-text-heading_medium">Slip Upload</h2>
                                        </header>
                                        <div class="slds-modal__content slds-p-around_medium">
                                            <lightning-flow flow-api-name={flowApiName} flow-input-variables={flowInputVariables} onstatuschange={handleFlowStatus}></lightning-flow>
                                        </div>
                                        <footer class="slds-modal__footer">
                                            <lightning-button label="Close" onclick={closeFlowModal}></lightning-button>
                                        </footer>
                                    </div>
                                </section>
                                <div class="slds-backdrop slds-backdrop_open"></div>
                            </template>
                        </template>

                        <!-- SlipInfo 페이지 -->
                        <template if:true={isSlipInfoPage}>
                            <template if:true={showSlipInfoNotEditMode}>
                                <lightning-button label={labels.edit} variant="brand" disabled={isHeaderEditDisabled} onclick={handleEditMode}></lightning-button>
                            </template>

                            <template if:true={showSlipInfoEditMode}>
                                <lightning-button-group>
                                    <lightning-button label={labels.cancel} variant="neutral" disabled={isHeaderSaveDisabled} onclick={handleCancel}></lightning-button>
                                    <lightning-button label={labels.save} variant="brand" disabled={isHeaderSaveDisabled} onclick={handleSave}></lightning-button>
                                </lightning-button-group>
                            </template>
                        </template>
                    </div>
                </div>

                <template if:true={showEndCompactLayout}>
                    <div class="slds-grid slds-border_bottom form-row">
                        <div class="slds-col slds-size_3-of-12 slds-align-middle">
                            <label class="slds-form-element__label">Risk Reference</label>
                        </div>
                        <div class="slds-col slds-size_9-of-12 cell-wrap">
                            <span class="view-text">{riskReference}</span>
                        </div>
                    </div>

                    <template if:true={showTypeField}>
                        <div class="slds-grid slds-border_bottom form-row">
                            <div class="slds-col slds-size_3-of-12 slds-align-middle">
                                <label class="slds-form-element__label">{TypeLabel}</label>
                            </div>
                            <div class={wrapperClassMap.Type__c} data-field="Type__c" onfocusin={handleFocus} onfocusout={handleBlur}>
                                <template if:true={isPlacementPage}>
                                    <template if:true={canEdit}>
                                        <lightning-combobox data-field="Type__c" value={formData.Type__c} options={TypeOptions} onchange={handleTypeChange} variant="label-hidden"></lightning-combobox>
                                    </template>
                                    <template if:false={canEdit}>
                                        <span class="view-text pre-wrap">{formData.Type__c}</span>
                                    </template>
                                </template>
                                <template if:false={isPlacementPage}>
                                    <span class="view-text pre-wrap">{formData.Type__c}</span>
                                </template>
                            </div>
                            <template if:true={TypeUI.hasPrevious}>
                                <lightning-helptext content={TypeUI.tooltip}></lightning-helptext>
                            </template>
                        </div>
                    </template>

                    <div class="slds-grid slds-border_bottom form-row">
                        <div class="slds-col slds-size_3-of-12 slds-align-middle"><label class="slds-form-element__label">{FormLabel}</label></div>
                        <div class={wrapperClassMap.Form__c} data-field="Form__c" onfocusin={handleFocus} onfocusout={handleBlur}>
                            <template if:true={canEdit}><lightning-input variant="label-hidden" data-field="Form__c" value={formData.Form__c} onchange={handleInputChange}></lightning-input></template>
                            <template if:false={canEdit}><span class="view-text pre-wrap">{formData.Form__c}</span></template>
                        </div>
                        <template if:true={formUI.hasPrevious}>
                            <lightning-helptext content={formUI.tooltip}></lightning-helptext>
                        </template>
                    </div>

                    <div class="slds-grid slds-border_bottom form-row">
                        <div class="slds-col slds-size_3-of-12 slds-align-middle"><label class="slds-form-element__label">{ReinsuredLabel}</label></div>
                        <div class={wrapperClassMap.Reinsured__c} data-field="Reinsured__c" onfocusin={handleFocus} onfocusout={handleBlur}>
                            <template if:true={canEdit}><lightning-input variant="label-hidden" data-field="Reinsured__c" value={formData.Reinsured__c} onchange={handleInputChange}></lightning-input></template>
                            <template if:false={canEdit}><span class="view-text pre-wrap">{formData.Reinsured__c}</span></template>
                        </div>
                        <template if:true={ReinsuredUI.hasPrevious}>
                            <lightning-helptext content={ReinsuredUI.tooltip}></lightning-helptext>
                        </template>
                    </div>

                    <div class="slds-grid slds-border_bottom form-row">
                        <div class="slds-col slds-size_3-of-12 slds-align-middle"><label class="slds-form-element__label">{InsuredLabel}</label></div>
                        <div class={wrapperClassMap.Insured__c} data-field="Insured__c" onfocusin={handleFocus} onfocusout={handleBlur}>
                            <template if:true={canEdit}><lightning-textarea variant="label-hidden" data-field="Insured__c" value={formData.Insured__c} onchange={handleInputChange}></lightning-textarea></template>
                            <template if:false={canEdit}><span class="view-text pre-wrap">{formData.Insured__c}</span></template>
                        </div>
                        <template if:true={InsuredUI.hasPrevious}>
                            <lightning-helptext content={InsuredUI.tooltip}></lightning-helptext>
                        </template>
                    </div>

                    <div class="slds-grid slds-border_bottom form-row">
                        <div class="slds-col slds-size_3-of-12 slds-align-middle"><label class="slds-form-element__label">{PeriodFromLabel}</label></div>
                        <div class={wrapperClassMap.PeriodFrom__c} data-field="PeriodFrom__c">
                            <template if:true={canEdit}><lightning-input value={formData.PeriodFrom__c} data-field="PeriodFrom__c" timezone="GMT" type="datetime" onchange={handleInputChange} variant="label-hidden"></lightning-input></template>
                            <template if:false={canEdit}><span class="view-text">{periodFromFormatted}</span></template>
                        </div>
                        <template if:true={PeriodFromUI.hasPrevious}>
                            <lightning-helptext content={PeriodFromUI.tooltip}></lightning-helptext>
                        </template>
                    </div>

                    <div class="slds-grid slds-border_bottom form-row">
                        <div class="slds-col slds-size_3-of-12 slds-align-middle"><label class="slds-form-element__label">{PeriodToLabel}</label></div>
                        <div class={wrapperClassMap.PeriodTo__c} data-field="PeriodTo__c">
                            <template if:true={canEdit}><lightning-input value={formData.PeriodTo__c} data-field="PeriodTo__c" timezone="GMT" type="datetime" onchange={handleInputChange} variant="label-hidden"></lightning-input></template>
                            <template if:false={canEdit}><span class="view-text">{periodToFormatted}</span></template>
                        </div>
                        <template if:true={PeriodToUI.hasPrevious}>
                            <lightning-helptext content={PeriodToUI.tooltip}></lightning-helptext>
                        </template>
                    </div>

                    <div class="slds-grid slds-border_bottom form-row">
                        <div class="slds-col slds-size_3-of-12 slds-align-middle"><label class="slds-form-element__label">{ENDEffectivedDateLabel}</label></div>
                        <div class={wrapperClassMap.ENDEffectivedDate__c} data-field="ENDEffectivedDate__c">
                            <template if:true={canEdit}><lightning-input value={formData.ENDEffectivedDate__c} data-field="ENDEffectivedDate__c" timezone="GMT" type="datetime" onchange={handleInputChange} variant="label-hidden"></lightning-input></template>
                            <template if:false={canEdit}><span class="view-text">{endEffectiveDateFormatted}</span></template>
                        </div>
                        <template if:true={ENDEffectivedDateUI.hasPrevious}>
                            <lightning-helptext content={ENDEffectivedDateUI.tooltip}></lightning-helptext>
                        </template>
                    </div>

                    <div class="slds-grid slds-border_bottom form-row">
                        <div class="slds-col slds-size_3-of-12 slds-align-middle"><label class="slds-form-element__label">{AmendmentsLabel}</label></div>
                        <div class={wrapperClassMap.Amendments__c} data-field="Amendments__c" onfocusin={handleFocus} onfocusout={handleBlur}>
                            <template if:true={canEdit}><lightning-textarea variant="label-hidden" data-field="Amendments__c" value={formData.Amendments__c} onchange={handleInputChange}></lightning-textarea></template>
                            <template if:false={canEdit}><span class="view-text pre-wrap">{formData.Amendments__c}</span></template>
                        </div>
                        <template if:true={AmendmentsUI.hasPrevious}>
                            <lightning-helptext content={AmendmentsUI.tooltip}></lightning-helptext>
                        </template>
                    </div>

                    <div class="slds-grid slds-border_bottom form-row">
                        <div class="slds-col slds-size_3-of-12 slds-align-middle"><label class="slds-form-element__label">{Prem100Label}</label></div>
                        <div class={wrapperClassMap.Prem100__c} data-field="Prem100__c" onfocusin={handleFocus} onfocusout={handleBlur}>
                            <template if:true={canEdit}><lightning-input variant="label-hidden" data-field="Prem100__c" value={formData.Prem100__c} onchange={handleInputChange}></lightning-input></template>
                            <template if:false={canEdit}><span class="view-text pre-wrap">{formData.Prem100__c}</span></template>
                        </div>
                        <template if:true={Prem100UI.hasPrevious}>
                            <lightning-helptext content={Prem100UI.tooltip}></lightning-helptext>
                        </template>
                    </div>

                    <template if:true={showEndPlacementFinancialSection}>
                        <!-- Gross Prem Section -->
                        <div class="slds-m-bottom_small slds-p-top_x-small">
                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_x-small">
                                <div class="slds-col">
                                    <label class="slds-form-element__label">Gross Prem</label>
                                </div>
                                <div class="slds-col slds-grow">
                                    <template if:true={showGrossPremMismatchMsg}>
                                        <div class="slds-notify slds-notify_alert slds-alert_error">
                                            {labels.grossPremMismatchMsg}: {mismatchCurrenciesGross}
                                        </div>
                                    </template>
                                    <template if:true={showGrossPremDPMismatchMsg}>
                                        <div class="slds-notify slds-notify_alert slds-alert_error">
                                            {grossPremDPMismatchMessage}
                                        </div>
                                    </template>
                                </div>
                                <div class="slds-col slds-no-flex">
                                    <lightning-button-group>
                                        <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh" variant="border" class="refresh-btn slds-p-left_x-small" onclick={handleRefreshGross} disabled={isGrossPremDisabled}></lightning-button-icon>
                                        <lightning-button label={labels.add} variant="neutral" disabled={isGrossPremDisabled} onclick={handleAddGross}></lightning-button>
                                        <lightning-button label={labels.save} variant="brand" onclick={handleSaveGross} disabled={isGrossPremSaveDisabled}></lightning-button>
                                    </lightning-button-group>
                                </div>
                            </div>

                            <div class="slds-p-horizontal_medium slds-m-bottom_medium">
                                <div class="slds-grid slds-gutters slds-m-bottom_xx-small">
                                    <div class="slds-col slds-size_3-of-12"><span class="slds-form-element__label">{labelPremCurrency}</span></div>
                                    <div class="slds-col slds-size_3-of-12"><span class="slds-form-element__label">{labelSlipGrossPrem}</span></div>
                                    <div class="slds-col slds-size_3-of-12"><span class="slds-form-element__label">{labelSlipGrossPremDP}</span></div>
                                    <div class="slds-col slds-size_3-of-12">&nbsp;</div>
                                </div>

                                <template for:each={premiumList} for:item="row">
                                    <div key={row.key} class={row.rowClass}>
                                        <div class="slds-col slds-size_3-of-12">
                                            <lightning-combobox value={row.Prem_Currency__c} options={TSICurrencyOptions} data-key={row.key} data-field="Prem_Currency__c" onchange={handleGrossRowChange} variant="label-hidden" disabled={isGrossPremDisabled}></lightning-combobox>
                                        </div>
                                        <div class="slds-col slds-size_3-of-12">
                                            <lightning-input type="number" step={row._amountStep} label="" class="cus-lk-input-right" value={row.SlipGrossPrem__c} data-key={row.key} data-field="SlipGrossPrem__c" onchange={handleGrossRowChange} variant="label-hidden" disabled={isGrossPremDisabled}></lightning-input>
                                        </div>
                                        <div class="slds-col slds-size_3-of-12">
                                            <lightning-input type="number" step={row._amountStep} label="" class="cus-lk-input-right" value={row.SlipGrossPremDP__c} data-key={row.key} data-field="SlipGrossPremDP__c" onchange={handleGrossRowChange} variant="label-hidden" disabled={isGrossPremDisabled}></lightning-input>
                                        </div>
                                        <div class="slds-col slds-size_3-of-12 slds-align-bottom">
                                            <lightning-button-icon icon-name="utility:delete" data-key={row.key} disabled={isGrossPremDisabled} onclick={handleDeleteGrossRow}></lightning-button-icon>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Total Sum Insured -->
                        <div class="slds-grid slds-border_bottom form-row">
                            <div class="slds-col slds-size_3-of-12 slds-align-middle">
                                <label class="slds-form-element__label">{TSILabel}</label>
                            </div>
                            <div class={wrapperClassMap.TSI__c} data-field="TSI__c" onfocusin={handleFocus} onfocusout={handleBlur}>
                                <template if:true={canEdit}>
                                    <lightning-textarea variant="label-hidden" data-field="TSI__c" value={formData.TSI__c} label="" class="auto-grow-textarea" onchange={handleInputChange}></lightning-textarea>
                                </template>
                                <template if:false={canEdit}>
                                    <span class="view-text">{formData.TSI__c}</span>
                                </template>
                            </div>
                            <template if:true={TSIUI.hasPrevious}>
                                <lightning-helptext content={TSIUI.tooltip}></lightning-helptext>
                            </template>
                            <lightning-button-icon icon-name={tsiIconName} variant="bare" onclick={handleTsiCollapse} alternative-text="Toggle Details" class="slds-m-left_xx-small"></lightning-button-icon>
                        </div>

                        <template if:true={isTsiExpanded}>
                            <div class="slds-p-around_small slds-theme_shade slds-border_bottom">
                                <div class="slds-grid slds-grid_align-end slds-grid_vertical-align-center">
                                    <div class="slds-col slds-size_3-of-12"></div>
                                    <div class="slds-col slds-size_9-of-12">
                                        <div class="slds-grid slds-align-center">
                                            <div class="slds-grow">
                                                <div class="slds-notify slds-notify_alert slds-alert_error" if:true={showTsiMismatchMsg}>
                                                    {labels.mismatchMsg}
                                                </div>
                                            </div>
                                            <div>
                                                <lightning-button-group>
                                                    <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh" variant="border" class="refresh-btn slds-p-left_x-small" onclick={handleRefreshTSI} disabled={isTSISectionDisabled}></lightning-button-icon>
                                                    <lightning-button label={labels.add} variant="neutral" disabled={isTSISectionDisabled} onclick={handleAddTSI}></lightning-button>
                                                    <lightning-button label={labels.save} variant="brand" onclick={handleSaveTSI} disabled={isTSISaveDisabled}></lightning-button>
                                                </lightning-button-group>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="slds-p-horizontal_medium slds-m-bottom_medium">
                                    <div class="slds-grid slds-gutters slds-m-bottom_xx-small">
                                        <div class="slds-col slds-size_4-of-12"><span class="slds-form-element__label">TSI Currency</span></div>
                                        <div class="slds-col slds-size_6-of-12"><span class="slds-form-element__label">TSI Amount</span></div>
                                        <div class="slds-col slds-size_2-of-12"></div>
                                    </div>

                                    <template for:each={tsiRows} for:item="row">
                                        <div key={row.key} class={row.rowClass}>
                                            <div class="slds-col slds-size_4-of-12">
                                                <lightning-combobox label="TSI Currency" variant="label-hidden" value={row.TSICurrency__c} options={TSICurrencyOptions} data-key={row.key} data-field="TSICurrency__c" onchange={handleRowChange} disabled={isTSISectionDisabled}></lightning-combobox>
                                            </div>
                                            <div class="slds-col slds-size_6-of-12">
                                                <lightning-input label="TSI Amount" variant="label-hidden" type="number" class="cus-lk-input-right" value={row.SlipTSI__c} data-key={row.key} data-field="SlipTSI__c" onchange={handleRowChange} disabled={isTSISectionDisabled}></lightning-input>
                                            </div>
                                            <div class="slds-col slds-size_2-of-12">
                                                <lightning-button-icon icon-name="utility:delete" data-key={row.key} disabled={isTSISectionDisabled} onclick={handleDeleteRow}></lightning-button-icon>
                                            </div>
                                        </div>
                                        <template if:true={row._currencyError}>
                                            <div key={row.key} class="slds-text-color_error slds-text-body_small slds-m-bottom_x-small slds-p-left_small">
                                                Only one record is allowed per currency.
                                            </div>
                                        </template>
                                    </template>
                                </div>

                                <template if:true={showTSIByLocation}>

                            <template for:each={tsiRows} for:item="row">
                                <div key={row.key} class={row.rowClass}>

                                    <div class="slds-col slds-size_4-of-12">
                                        <lightning-combobox
                                                label="TSI Currency"
                                                variant="label-hidden"
                                                value={row.TSICurrency__c}
                                                options={TSICurrencyOptions}
                                                data-key={row.key}
                                                data-field="TSICurrency__c"
                                                onchange={handleRowChange}
                                                disabled={isTSISectionDisabled}>
                                        </lightning-combobox>
                                    </div>

                                    <div class="slds-col slds-size_6-of-12">
                                        <lightning-input
                                                label="TSI Amount"
                                                variant="label-hidden"
                                                type="number"
                                                class="cus-lk-input-right"
                                                value={row.SlipTSI__c}
                                                data-key={row.key}
                                                data-field="SlipTSI__c"
                                                onchange={handleRowChange}
                                                disabled={isTSISectionDisabled}>
                                        </lightning-input>
                                    </div>

                                    <div class="slds-col slds-size_2-of-12">
                                        <lightning-button-icon
                                                icon-name="utility:delete"
                                                data-key={row.key}
                                                disabled={isTSISectionDisabled}
                                                onclick={handleDeleteRow}>
                                        </lightning-button-icon>
                                    </div>

                                </div>
                                <template if:true={row._currencyError}>
                                    <div key={row.key} class="slds-text-color_error slds-text-body_small slds-m-bottom_x-small slds-p-left_small">
                                        Only one record is allowed per currency.
                                    </div>
                                </template>
                            </template>
                        </div>

                        <template if:true={showTSIByLocation}>
                            <c-opp-t-s-i-by-location-table
                                    record-id={recordId}
                                    slip-info-id={resolvedSlipInfoId}
                                    placement-id={recordId}
                                    slip-tsi-map={slipTSIMap}
                                    suppress-mismatch-msg={hasSoaSchedule}
                                    onpremchange={handlePremChange}
                                    is-locked-by-stage={isTSIByLocationLocked}>
                            </c-opp-t-s-i-by-location-table>
                        </template>
                    </div>
                </template>

                <!-- Terms and Conditions -->
                <div class="slds-grid slds-border_bottom form-row">
                    <div class="slds-col slds-size_3-of-12 slds-align-middle">
                        <label class="slds-form-element__label">{TermsCondsLabel}</label>
                    </div>
                    <div class={wrapperClassMap.TermsConds__c} data-field="TermsConds__c" onfocusin={handleFocus} onfocusout={handleBlur}>
                        <template if:true={canEdit}>
                            <lightning-textarea
                                    variant="label-hidden"
                                    data-field="TermsConds__c"
                                    value={formData.TermsConds__c}
                                    onchange={handleInputChange}
                                    class="auto-grow-textarea">
                            </lightning-textarea>
                        </template>

                        <template if:false={canEdit}>
                            <span class="view-text">{formData.TermsConds__c}</span>
                        </template>
                    </div>
                    <template if:true={TermsCondsUI.hasPrevious}>
                        <lightning-helptext content={TermsCondsUI.tooltip}></lightning-helptext>
                    </template>
                </div>

                <!-- Extension Clauses -->
                <div class="slds-grid slds-border_bottom form-row">
                    <div class="slds-col slds-size_3-of-12 slds-align-middle">
                        <label class="slds-form-element__label">{ExtensionClausesLabel}</label>
                    </div>
                    <div class={wrapperClassMap.ExtensionClauses__c} data-field="ExtensionClauses__c" onfocusin={handleFocus} onfocusout={handleBlur}>
                        <template if:true={canEdit}>
                            <lightning-textarea variant="label-hidden" data-field="ExtensionClauses__c"
                                                value={formData.ExtensionClauses__c}
                                                class="auto-grow-textarea" onchange={handleInputChange}></lightning-textarea>
                        </template>
                        <template if:false={canEdit}>
                            <span class="view-text">{formData.ExtensionClauses__c}</span>
                        </template>
                    </div>
                    <template if:true={ExtensionClausesUI.hasPrevious}>
                        <lightning-helptext content={ExtensionClausesUI.tooltip}></lightning-helptext>
                    </template>
                </div>


                <!-- Loss Record -->
                <div class="slds-grid slds-border_bottom form-row">
                    <div class="slds-col slds-size_3-of-12 slds-align-middle">
                        <label class="slds-form-element__label">{LossRecordLabel}</label>
                    </div>
                    <div class={wrapperClassMap.LossRecord__c} data-field="LossRecord__c" onfocusin={handleFocus} onfocusout={handleBlur}>
                        <template if:true={canEdit}>
                            <lightning-textarea variant="label-hidden" data-field="LossRecord__c" value={formData.LossRecord__c}
                                                class="auto-grow-textarea" onchange={handleInputChange}></lightning-textarea>
                        </template>
                        <template if:false={canEdit}>
                            <span class="view-text">{formData.LossRecord__c}</span>
                        </template>
                    </div>
                    <template if:true={LossRecordUI.hasPrevious}>
                        <lightning-helptext content={LossRecordUI.tooltip}></lightning-helptext>
                    </template>
                </div>


                <!-- Additional Information -->
                <div class="slds-grid slds-border_bottom form-row">
                    <div class="slds-col slds-size_3-of-12 slds-align-middle">
                        <label class="slds-form-element__label">{AddInfoLabel}</label>
                    </div>
                    <div class={wrapperClassMap.AddInfo__c} data-field="AddInfo__c" onfocusin={handleFocus} onfocusout={handleBlur}>
                        <template if:true={canEdit}>
                            <lightning-textarea variant="label-hidden" data-field="AddInfo__c" value={formData.AddInfo__c}
                                                onchange={handleInputChange}></lightning-textarea>
                        </template>
                        <template if:false={canEdit}>
                            <span class="view-text">{formData.AddInfo__c}</span>
                        </template>
                    </div>
                    <template if:true={AddInfoUI.hasPrevious}>
                        <lightning-helptext content={AddInfoUI.tooltip}></lightning-helptext>
                    </template>
                </div>

                <!-- RI Cession(Reins.) (%) -->
                <div class="slds-grid slds-border_bottom form-row">
                    <div class="slds-col slds-size_3-of-12 slds-align-middle">
                            <label class="slds-form-element__label">{RICessionLabel}</label>
                    </div>
                    <div class={wrapperClassMap.RICession__c} data-field="RICession__c" onfocusin={handleFocus} onfocusout={handleBlur}>
                        <template if:true={canEdit}>
                            <lightning-input variant="label-hidden" data-field="RICession__c" value={formData.RICession__c} label=""
                                             onchange={handleInputChange}></lightning-input>
                        </template>
                        <template if:false={canEdit}>
                            <span class="view-text">{formData.RICession__c}</span>
                        </template>
                    </div>
                    <template if:true={RICessionUI.hasPrevious}>
                        <lightning-helptext content={RICessionUI.tooltip}></lightning-helptext>
                    </template>
                </div>

                <!-- RI Comm (%) -->
                <div class="slds-grid slds-border_bottom form-row">
                    <div class="slds-col slds-size_3-of-12 slds-align-middle">
                            <label class="slds-form-element__label">{RICommLabel}</label>
                    </div>
                    <div class={wrapperClassMap.RIComm__c} data-field="RIComm__c" onfocusin={handleFocus} onfocusout={handleBlur}>
                        <template if:true={canEdit}>
                            <lightning-input variant="label-hidden" data-field="RIComm__c" value={formData.RIComm__c}
                                             onchange={handleInputChange}></lightning-input>
                        </template>
                        <template if:false={canEdit}>
                            <span class="view-text">{formData.RIComm__c}</span>
                        </template>
                    </div>
                    <template if:true={RICommUI.hasPrevious}>
                        <lightning-helptext content={RICommUI.tooltip}></lightning-helptext>
                    </template>
                </div>

                <!-- Other Deduction -->
                <div class="slds-grid slds-border_bottom form-row">
                    <div class="slds-col slds-size_3-of-12 slds-align-middle">
                            <label class="slds-form-element__label">{OtherDeductionLabel}</label>
                    </div>
                    <div class={wrapperClassMap.OtherDeduction__c} data-field="OtherDeduction__c" onfocusin={handleFocus} onfocusout={handleBlur}>
                        <template if:true={canEdit}>
                            <lightning-textarea variant="label-hidden" data-field="OtherDeduction__c" value={formData.OtherDeduction__c}
                                                class="auto-grow-textarea" onchange={handleInputChange}></lightning-textarea>
                        </template>
                        <template if:false={canEdit}>
                            <span class="view-text">{formData.OtherDeduction__c}</span>
                        </template>
                    </div>
                    <template if:true={OtherDeductionUI.hasPrevious}>
                        <lightning-helptext content={OtherDeductionUI.tooltip}></lightning-helptext>
                    </template>
                </div>

                </template>

            </div>
        </div>
    </lightning-card>
</template>
