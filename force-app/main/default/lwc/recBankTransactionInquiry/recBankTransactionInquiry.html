<template>
    <div class="container">
        <div lwc:if={_isLoading} class="spinner">
            <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
        </div>

        <!-- TITLE -->
        <div class="title slds-text-heading_medium slds-var-p-around_medium slds-text-font_monospace">
            Inquiry Bank Transaction
        </div>

        <!-- FILTER -->
        <div class="filter-wrapper slds-box slds-box_xx-small slds-var-m-vertical_medium">
            <c-rec-filter-bar filter-defs={filterDefs} filter-width="10" lwc:ref="filter">
                <lightning-button-group slot="actions">
                    <lightning-button
                        name="action_Inquiry"
                        label="Inquiry"
                        icon-name="utility:search"
                        variant="brand"
                        onclick={handleInquiryClick}
                    ></lightning-button>
                    <lightning-button
                        name="action_Reset"
                        label="Reset"
                        icon-name="utility:undo"
                        variant="neutral"
                        onclick={handleResetClick}
                    ></lightning-button>
                </lightning-button-group>
            </c-rec-filter-bar>
        </div>

        <!-- TABLE -->
        <div class="table-summary">
            <span>Rows: {displayRowCount} / Selected: {displaySelectedCount}</span>

            <div class="table-actions">
                <lightning-button-group>
                    <lightning-button
                        label="Fiduciary Liability Others Mapping"
                        onclick={handleFiduciaryLiabilityClick}
                        disabled={fiduciaryBtnDisabled}
                    ></lightning-button>
                    <lightning-button
                        label="Account Mapping"
                        onclick={handleAccountMappingClick}
                        disabled={accountMappingBtnDisabled}
                    ></lightning-button>
                    <lightning-button label="Save" variant="brand" disabled={saveBtnDisabled} onclick={handleTableSave}>
                    </lightning-button>
                </lightning-button-group>
            </div>
        </div>
        <div class="table-wrapper">
            <c-rec-table
                lwc:ref="table"
                key-field="Id"
                columns={tableColumns}
                data={tableData}
                onrowselection={handleRowSelection}
                oncellchange={handleCellChange}
                oncellbuttonclick={handleCellButtonClick}
                ondirtystatechange={handleDirtyStateChange}
            ></c-rec-table>
        </div>
    </div>
</template>
