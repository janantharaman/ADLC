<template>
    <div class="slds-p-around_medium slds-p-left_large">
        <lightning-card title={cardTitle} icon-name="standard:news">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>
            <div slot="actions">
                <lightning-button-icon
                        icon-name="utility:refresh"
                        alternative-text={labels.COM_LBL_RefreshRef}
                        class="slds-p-right_small"
                        onclick={handleRefresh}>
                </lightning-button-icon>
            </div>
            <div class="slds-box slds-p-horizontal_small" style={containerStyle}>
                <template if:true={hasNews}>
                    <template for:each={visibleItems} for:item="news">
                        <c-acc-news-item key={news.Id} news={news}></c-acc-news-item>
                    </template>

                    <template if:true={showTopButton}>
                        <div style="position: sticky; bottom: 8px; text-align: right;">
                            <lightning-button-icon
                                    icon-name="utility:arrow_top"
                                    alternative-text="Top"
                                    variant="brand"
                                    class="slds-p-right_xx-large"
                                    onclick={handleScrollTop}>
                            </lightning-button-icon>
                        </div>
                    </template>
                    <template if:true={showViewAll}>
                        <div class="slds-p-vertical_x-small slds-text-align_center">
                            <lightning-button
                                    label="View All"
                                    variant="base"
                                    onclick={handleViewAll}>
                            </lightning-button>
                        </div>
                    </template>
                </template>

                <template if:false={hasNews}>
                    <template if:false={isLoading}>
                        <div class="slds-p-around_medium slds-text-align_center slds-text-color_weak">
                            {message}
                        </div>
                    </template>
                </template>
            </div>
        </lightning-card>
    </div>
</template>
