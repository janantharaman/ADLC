<template>
    <div class="slds-p-around_medium slds-p-left_large">
        <lightning-card title={pageTitleDisplay} icon-name="standard:file">
<!--            <div slot="actions" class="slds-p-horizontal_small slds-grid slds-grid_align-spread" style="width: 100%;">-->
<!--            </div>-->
            <div>
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                    <!-- 1. 왼쪽 영역 (검색 필터) slds-grid_vertical-align-end-->
                    <template if:true={allowSearch}>
                        <div class="slds-col slds-p-bottom_none">
                            <div class="slds-grid slds-grid_vertical-align-end slds-p-left_large">
                                <span class="slds-p-right_small slds-p-bottom_small slds-text-title_bold">Title</span>
                                <lightning-input
                                        label="Title"
                                        variant="label-hidden"
                                        placeholder="Title Search..."
                                        class="slds-p-top_large"
                                        min-length="2"
                                        max-length="30"
                                        value={searchText}
                                        onchange={handleChange}
                                        onkeydown={handleKeyDown}
                                >
                                </lightning-input>
                            </div>
                        </div>
                    </template>
                    <!-- 2. 오른쪽 영역 (버튼 그룹) -->
                    <div class="slds-col slds-col_bump-left">
                        <div class="slds-grid slds-grid_vertical-align-center slds-p-bottom_x-small">
                            <template if:true={allowSearch}>
                                <div class="slds-p-top_medium slds-p-right_medium">
                                    <lightning-button-group>
                                        <lightning-button-icon icon-name="action:refresh"
                                                title={labels.COM_LBL_REFRESH}
                                                onclick={handleRefresh}>
                                        </lightning-button-icon>
                                        <lightning-button label={labels.COM_LBL_SEARCH} variant="brand" onclick={handleSearch}> </lightning-button>
                                    </lightning-button-group>
                                </div>
                            </template>
                            <template if:true={allowUpload}>
                                <lightning-file-upload
                                        label=""
                                        name="fileUpload"
                                        record-id={recordId}
                                        onuploadfinished={handleUploadFinished}
                                        multiple>
                                </lightning-file-upload>
                            </template>
                            <lightning-button-group class="slds-p-top_medium slds-p-left_x-small">
                                <lightning-button-icon
                                        icon-name="action:refresh"
                                        title={labels.COM_LBL_REFRESH}
                                        onclick={handleRefresh}>
                                </lightning-button-icon>
                                <template if:true={allowDelete}>
                                    <lightning-button
                                            label="Delete"
                                            icon-name="utility:delete"
                                            onclick={handleDelete}>
                                    </lightning-button>
                                </template>
                            </lightning-button-group>
                        </div>
                    </div>
                </div>
            </div>

            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>
            <div class="slds-p-horizontal_small" style={tableStyle}>
                <c-rec-table
                        lwc:ref="table"
                        key-field="Id"
                        columns={tableColumns}
                        data={tableData}
                        hide-checkbox-column={hideCheckboxColumn}
                        oncellbuttonclick={handleFileClick}
                        onrowselection={handleRowSelection}
                ></c-rec-table>
            </div>

        </lightning-card>
    </div>
</template>
