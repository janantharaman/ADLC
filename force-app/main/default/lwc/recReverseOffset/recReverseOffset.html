<template>
    <div class="container">
        <div lwc:if={_isLoading} class="spinner">
            <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
        </div>

        <div class="section">
            <div class="section-header">
                <div class="section-header-left">
                    <span class="section-title">Settlement Line Items</span>
                </div>
            </div>

            <div class="section-body">
                <div class="table-summary">
                    <span>Rows: {displayRowCount}</span>
                </div>

                <div class="table-wrapper">
                    <c-rec-table
                        lwc:ref="offsetSliTable"
                        class="table"
                        key-field="Id"
                        columns={offsetSliColumns}
                        data={offsetSliData}
                        hide-checkbox-column
                    ></c-rec-table>
                </div>
            </div>
        </div>
    </div>
</template>
