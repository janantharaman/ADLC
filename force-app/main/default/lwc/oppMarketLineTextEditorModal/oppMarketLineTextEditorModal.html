<template>
    <div class="slds-p-around_small">
        <template if:true={isRichText}>
            <lightning-input-rich-text
                value={value}
                onchange={handleChange}
                disabled={isReadOnly}
                placeholder={labels.COM_MSG_ENTER_CONTENT}
                share-with-entity-id={recordId}
                style="min-height: 150px;"
            >
            </lightning-input-rich-text>
        </template>
        <template if:false={isRichText}>
            <div class="slds-form-element">
                <div class="slds-form-element__control">
                    <textarea
                        class="slds-textarea"
                        oninput={handleAutoGrow}
                        disabled={isReadOnly}
                        placeholder={labels.COM_MSG_ENTER_CONTENT}
                        style="min-height: 100px; overflow-y: hidden; resize: none;"
                    >{value}</textarea>
                </div>
            </div>
        </template>
    </div>
</template>
