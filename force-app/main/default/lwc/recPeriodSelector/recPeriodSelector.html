<template>
    <div class={wrapperClass}>
        <lightning-layout vertical-align="end">
            <lightning-layout-item size="5" class="slds-p-right_xx-small">
                <lightning-input
                    name="_periodFromDate"
                    type="date"
                    label={label_from}
                    value={_periodFromDate}
                    variant={variant}
                    placeholder={placeholder_from}
                    onchange={handleDateChange}
                ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="5" class="slds-p-horizontal_xx-small">
                <lightning-input
                    name="_periodToDate"
                    type="date"
                    label={label_to}
                    variant={variant}
                    value={_periodToDate}
                    placeholder={placeholder_to}
                    onchange={handleDateChange}
                ></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="2" class="slds-p-left_xx-small">
                <lightning-button-menu
                    icon-name="utility:event"
                    alternative-text="Quick select period"
                    onselect={handlePeriodButtonSelect}
                >
                    <template for:each={menuItems} for:item="menuItem">
                        <lightning-menu-item
                            key={menuItem.value}
                            value={menuItem.value}
                            label={menuItem.label}
                        ></lightning-menu-item>
                    </template>
                </lightning-button-menu>
            </lightning-layout-item>
        </lightning-layout>
        <template if:true={_errorMessage}>
            <div class="rps-error-message">{_errorMessage}</div>
        </template>
    </div>
</template>
