<template>
    <div class="excel-container">
        <!-- Header Validation Error - Show error message and template download only -->
        <template if:true={headerValidationError}>
            <div class="slds-text-align_center slds-p-vertical_large slds-p-top_large">
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                    <span class="slds-assistive-text">error</span>
                    <lightning-icon icon-name="utility:error" size="x-small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                    <h2>{headerValidationError}</h2>
                </div>
            </div>
        </template>

        <!-- Error Summary - Only show when no header error -->
        <template if:false={headerValidationError}>
            <template if:true={hasErrors}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                    <span class="slds-assistive-text">error</span>
                    <lightning-icon icon-name="utility:error" size="x-small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                    <h2>Please fix all validation errors before saving</h2>
                </div>
            </template>

            <!-- Header with Actions - Only show when no header error -->
            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                <div class="slds-col">
                    <h3 class="slds-text-heading_small">Edit Data</h3>
                </div>
                <div class="slds-col_bump-left">
                    <!-- Focus Error Cell Button -->
                    <template if:true={hasErrors}>
                        <lightning-button label="Focus On Error Cell" icon-name="utility:error" variant="destructive-text" onclick={handleFocusErrorCell} class="slds-m-right_small"> </lightning-button>
                    </template>
                    <!-- Template Download -->
                    <lightning-button label="Download Template" icon-name="utility:file" variant="neutral" onclick={handleDownloadTemplate} class="slds-m-right_small"> </lightning-button>
                    <!-- Current Data Export -->
                    <lightning-button label="Export to Excel" icon-name="utility:download" onclick={handleExport} class="slds-m-right_small"> </lightning-button>
                    <p class="slds-text-body_small slds-text-color_weak" style="display: inline-block">
                        <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
                        Click any cell to edit. Hover over red cells to see error details.
                    </p>
                </div>
            </div>
        </template>

        <!-- Excel 스타일 테이블 - Always show -->
        <div class="table-container" onscroll={handleScroll}>
            <table class="excel-table">
                <!-- 헤더 -->
                <thead>
                    <!-- Header Validation Error Row -->
                    <template if:true={headerValidationError}>
                        <tr>
                            <th colspan="999" class="error-header-cell" style="vertical-align: middle; padding: 2rem; height: 200px">
                                <div class="slds-align_absolute-center" style="flex-direction: column; height: 100%">
                                    <p class="slds-text-body_regular slds-m-bottom_small">
                                        <lightning-icon icon-name="utility:info" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                        Please download the correct template and upload again with matching headers.
                                    </p>
                                    <lightning-button label="Download Template" icon-name="utility:file" variant="brand" onclick={handleDownloadTemplate}> </lightning-button>
                                </div>
                            </th>
                        </tr>
                    </template>

                    <!-- Normal Header Row -->
                    <template if:false={headerValidationError}>
                        <tr>
                            <th class="row-number-header">#</th>
                            <template for:each={headers} for:item="header">
                                <th key={header.apiName} class="excel-header">{header.label}</th>
                            </template>
                        </tr>
                    </template>
                </thead>

                <!-- 데이터 (가상 스크롤) -->
                <tbody>
                    <!-- Only show when no header error -->
                    <template if:false={headerValidationError}>
                        <!-- 위쪽 스페이서 -->
                        <tr class="spacer-row">
                            <td colspan={columnSpan} style={topSpacerStyle}></td>
                        </tr>

                        <!-- 보이는 행만 렌더 -->
                        <template for:each={visibleRows} for:item="vrow">
                            <tr key={vrow.index} class="excel-row">
                                <td class="row-number">{vrow.rowNumber}</td>
                                <template for:each={vrow.cells} for:item="cell" for:index="colIndex">
                                    <td key={cell.fieldName} class="excel-cell">
                                        <div class="cell-wrapper">
                                            <input type="text" class={cell.cellInputClass} value={cell.displayValue} data-row={vrow.index} data-col={colIndex} data-field-name={cell.fieldName} onchange={handleCellChange} />
                                            <!-- Error Tooltip -->
                                            <template if:true={cell.hasError}>
                                                <div class="error-tooltip">
                                                    <lightning-icon icon-name="utility:error" size="x-small" variant="error" class="error-icon"> </lightning-icon>
                                                    <span class="tooltip-text">{cell.error}</span>
                                                </div>
                                            </template>
                                        </div>
                                    </td>
                                </template>
                            </tr>
                        </template>

                        <!-- 아래쪽 스페이서 -->
                        <tr class="spacer-row">
                            <td colspan={columnSpan} style={bottomSpacerStyle}></td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <!-- Action Buttons - Always visible -->
        <div class="slds-m-top_medium slds-grid slds-grid_align-end">
            <lightning-button label={labels.cancel} onclick={handleCancel} disabled={isSaving} class="slds-m-right_x-small"> </lightning-button>
            <lightning-button variant="brand" label={labels.save} onclick={handleSave} disabled={disableSave}> </lightning-button>
        </div>
    </div>

    <!-- 로딩 스피너 -->
    <template if:true={isSaving}>
        <lightning-spinner alternative-text="Saving..." size="medium"></lightning-spinner>
    </template>

    <!-- 데이터 로딩 스피너 -->
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading data..." size="medium"></lightning-spinner>
    </template>
</template>
