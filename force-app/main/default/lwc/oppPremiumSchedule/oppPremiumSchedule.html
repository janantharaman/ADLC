<template>
    <div class="slds-p-around_medium">
        <!-- # of Installs Section (Horizontal Layout with Fixed Widths) -->
        <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
            <!-- Label -->
            <div class="slds-col slds-shrink-none" style="width: 100px">
                <span class="slds-form-element__label slds-text-body_regular">{totalInstallsLabel}</span>
            </div>

            <!-- Input -->
            <div class="slds-col slds-shrink-none slds-p-left_small" style="width: 150px">
                <template if:true={canEdit}>
                    <lightning-input
                        type="number"
                        label=""
                        value={editableTotalInstalls}
                        onchange={handleTotalInstallsChange}
                        min="2"
                        step="1"
                        variant="label-hidden"
                        message-when-range-underflow="Value must be at least 2"
                        class="cus-lk-input-right"
                    ></lightning-input>
                </template>
                <template if:false={canEdit}>
                    <div class="view-cell-right">
                        <span class="slds-truncate" title={editableTotalInstalls}> {editableTotalInstalls} </span>
                    </div>
                </template>
            </div>

            <!-- Button -->
            <template if:true={canEdit}>
                <div class="slds-col slds-shrink-none slds-p-left_small" style="width: 100px">
                    <lightning-button
                        label="Update"
                        variant="brand"
                        onclick={handleUpdateInstalls}
                        disabled={isUpdateDisabled}
                    ></lightning-button>
                </div>
            </template>

            <!-- Error Message (고정 너비 확보) -->
            <div class="slds-col slds-grow slds-p-left_medium error-area">
                <template if:true={validationErrorMessage}>
                    <span class="slds-text-color_error slds-text-body_small slds-text-title_bold error-text">
                        {validationErrorMessage}
                    </span>
                </template>
            </div>
        </div>

        <!-- Schedule Table -->
        <template if:true={hasSchedules}>
            <div class="schedule-table">
                <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-table_fixed-layout">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col" class="slds-text-align_center" style="width: 60px">
                                <div class="slds-truncate">#</div>
                            </th>
                            <th scope="col" class="slds-text-align_center">
                                <div class="slds-truncate">{daysFromInceptionLabel}</div>
                            </th>
                            <th scope="col" class="slds-text-align_center">
                                <div class="slds-truncate">{percentageLabel}</div>
                            </th>
                            <th scope="col" class="slds-text-align_center">
                                <div class="slds-truncate">{installDateLabel}</div>
                            </th>
                            <th scope="col" class="slds-text-align_center" style="width: 60px">
                                <div class="slds-truncate"></div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={scheduleRows} for:item="row">
                            <tr key={row.index} class="slds-hint-parent">
                                <td class="slds-text-align_center">
                                    <div class="slds-truncate">{row.rowNumber}</div>
                                </td>
                                <td class="slds-p-horizontal_x-small">
                                    <template if:true={canEdit}>
                                        <lightning-input
                                            type="number"
                                            label=""
                                            value={row.daysFromInception}
                                            data-id={row.index}
                                            onchange={handleDaysChange}
                                            variant="label-hidden"
                                            min="0"
                                            class="cus-lk-input-right"
                                        ></lightning-input>
                                    </template>
                                    <template if:false={canEdit}>
                                        <div class="view-cell-right">
                                            <span class="slds-truncate" title={row.daysFromInception}>
                                                {row.daysFromInception}
                                            </span>
                                        </div>
                                    </template>
                                </td>
                                <td class="slds-p-horizontal_x-small">
                                    <template if:true={canEdit}>
                                        <lightning-input
                                            type="number"
                                            label=""
                                            value={row.percentage}
                                            data-id={row.index}
                                            onchange={handlePercentageChange}
                                            variant="label-hidden"
                                            min="0"
                                            max="100"
                                            step="0.01"
                                            message-when-range-overflow="Value must be between 0 and 100"
                                            message-when-range-underflow="Value must be between 0 and 100"
                                            formatter="percent-fixed"
                                            class="cus-lk-input-right"
                                        ></lightning-input>
                                    </template>
                                    <template if:false={canEdit}>
                                        <div class="view-cell-right">
                                            <span class="slds-truncate" title={row.percentage}>
                                                {row.percentage}%
                                            </span>
                                        </div>
                                    </template>
                                </td>
                                <td class="slds-text-align_center">
                                    <template if:true={row.installDate}>
                                        <lightning-formatted-date-time
                                            value={row.installDate}
                                            year="numeric"
                                            month="2-digit"
                                            day="2-digit"
                                        ></lightning-formatted-date-time>
                                    </template>
                                </td>
                                <td class="slds-text-align_center">
                                    <template if:true={showDeleteButtons}>
                                        <template if:true={canEdit}>
                                            <lightning-button-icon
                                                icon-name="utility:delete"
                                                alternative-text={labels.delete}
                                                variant="bare"
                                                onclick={handleDeleteRow}
                                                data-id={row.index}
                                                class="slds-m-left_xx-small"
                                            ></lightning-button-icon>
                                        </template>
                                    </template>
                                </td>
                            </tr>
                        </template>
                        <!-- Total Row -->
                        <tr class="total-row">
                            <td colspan="2" class="slds-text-align_right slds-p-right_small">
                                <span class="slds-text-body_regular">Total</span>
                            </td>
                            <td class="slds-text-align_center">
                                <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-center">
                                    <span class="total-percentage">{totalPercentage}%</span>
                                </div>
                            </td>
                            <td colspan="2">
                                <template if:true={totalPercentageError}>
                                    <span class="slds-text-color_error slds-text-body_small slds-p-left_small">
                                        {totalPercentageError}
                                    </span>
                                </template>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </template>

        <!-- Action Buttons -->
        <template if:true={canEdit}>
            <div class="slds-m-top_medium slds-text-align_center">
                <lightning-button
                    label={labels.cancel}
                    variant="neutral"
                    onclick={handleCancel}
                    class="slds-m-right_x-small"
                ></lightning-button>
                <lightning-button
                    label={labels.save}
                    variant="brand"
                    onclick={handleSave}
                    disabled={isSaveDisabled}
                ></lightning-button>
            </div>
        </template>

        <!-- Success Message -->
        <template if:true={successMessage}>
            <div class="slds-m-top_small slds-text-align_center">
                <lightning-formatted-text
                    value={successMessage}
                    class="slds-text-color_success"
                ></lightning-formatted-text>
            </div>
        </template>
    </div>
</template>
