<template>
    <div class="container">
        <div lwc:if={_isLoading} class="spinner">
            <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
        </div>

        <!-- ═══ Section 1: Bank Transaction ═══ -->
        <div class="section">
            <div class="section-header">
                <div class="section-header-left">
                    <span class="section-title">Bank Transaction</span>
                </div>
                <div class="section-actions">
                    <lightning-button-group>
                        <lightning-button
                            label="Draft"
                            icon-name="utility:advanced_function"
                            variant="neutral"
                            disabled={draftBtnDisabled}
                            onclick={handleDraft}
                        ></lightning-button>
                        <lightning-button
                            label="Confirm"
                            icon-name="utility:check"
                            variant="brand"
                            disabled={confirmBtnDisabled}
                            onclick={handleConfirm}
                        ></lightning-button>
                    </lightning-button-group>
                </div>
            </div>
            <div class="section-body">
                <c-rec-table
                    lwc:ref="baseBtTable"
                    key-field="Id"
                    columns={baseBtColumns}
                    data={baseBtData}
                    hide-checkbox-column
                    object-api-name="ReconciliationLineItem__c"
                ></c-rec-table>
            </div>
        </div>

        <!-- ═══ Section 2: Select Settlement Line Items ═══ -->
        <div class="section">
            <div class="section-header">
                <span class="section-title">Select Settlement Line Items</span>
            </div>
            <div class="section-body">
                <lightning-tabset active-tab-value={_activeTab} onactive={handleTabChange}>
                    <!-- Tab: Settlement Line Item -->
                    <lightning-tab label="Settlement Line Item" value="sli" onactive={handleTabChange}>
                        <!-- Filter -->
                        <div class="filter-wrapper slds-box slds-box_xx-small slds-var-m-vertical_medium">
                            <c-rec-filter-bar
                                filter-defs={sliFilterDefs}
                                filter-width="10"
                                collapsible
                                lwc:ref="sliFilter"
                                object-api-name="SettlementLineItem__c"
                            >
                                <lightning-button-group slot="actions">
                                    <lightning-button
                                        name="action_Inquiry"
                                        label="Inquiry"
                                        icon-name="utility:search"
                                        variant="brand"
                                        disabled={isConfirmed}
                                        onclick={handleSliInquiryClick}
                                    ></lightning-button>
                                    <lightning-button
                                        name="action_Reset"
                                        label="Reset"
                                        icon-name="utility:undo"
                                        variant="neutral"
                                        disabled={isConfirmed}
                                        onclick={handleSliResetClick}
                                    ></lightning-button>
                                </lightning-button-group>
                            </c-rec-filter-bar>
                        </div>

                        <!-- SLI Table -->
                        <div class="table-summary">
                            <span>Rows: {displayRowCount} / Selected: {displaySelectedCount}</span>
                            <div class="table-actions">
                                <lightning-button-group>
                                    <lightning-button-icon
                                        name="action_ExpandAll"
                                        label="Expand All"
                                        title="Expand All"
                                        alternative-text="Expand All"
                                        icon-name="utility:add"
                                        variant="neutral"
                                        onclick={handleSliExpandAllClick}
                                    ></lightning-button-icon>
                                    <lightning-button-icon
                                        name="action_CollapseAll"
                                        label="Collapse All"
                                        title="Collapse All"
                                        alternative-text="Collapse All"
                                        icon-name="utility:dash"
                                        variant="neutral"
                                        onclick={handleSliCollapseAllClick}
                                    ></lightning-button-icon>
                                </lightning-button-group>

                                <lightning-button
                                    name="action_SliConfirm"
                                    label="Confirm"
                                    title="Confirm"
                                    alternative-text="Confirm"
                                    class="slds-var-m-left_small"
                                    variant="neutral"
                                    disabled={sliConfirmBtnDisabled}
                                    onclick={handleSliConfirmClick}
                                ></lightning-button>

                                <lightning-button
                                    name="action_Select"
                                    label="Select"
                                    title="Select"
                                    alternative-text="Select"
                                    class="slds-var-m-left_small"
                                    variant="brand"
                                    disabled={actionBtnsDisabled}
                                    onclick={handleSliSelect}
                                ></lightning-button>
                            </div>
                        </div>

                        <div class="table-wrapper inquiry-table">
                            <c-rec-table
                                lwc:ref="sliTable"
                                key-field="Id"
                                columns={sliColumns}
                                data={sliData}
                                disabled-row-ids={sliDisabledRowIds}
                                onrowselection={handleSliRowSelection}
                                oncellchange={handleSliCellChange}
                                ongroupcollapse={handleSliGroupCollapse}
                                object-api-name="SettlementLineItem__c"
                            ></c-rec-table>
                        </div>
                    </lightning-tab>

                    <!-- Tab: Note -->
                    <lightning-tab label="Note" value="note" onactive={handleTabChange}>
                        <div class="filter-wrapper slds-box slds-box_xx-small slds-var-m-vertical_medium">
                            <c-rec-filter-bar
                                filter-defs={noteFilterDefs}
                                filter-width="10"
                                lwc:ref="noteFilter"
                                data-id="noteFilter"
                            >
                                <lightning-button-group slot="actions">
                                    <lightning-button
                                        name="action_Inquiry"
                                        label="Inquiry"
                                        icon-name="utility:search"
                                        variant="brand"
                                        disabled={isConfirmed}
                                        onclick={handleNoteInquiryClick}
                                    ></lightning-button>
                                    <lightning-button
                                        name="action_Reset"
                                        label="Reset"
                                        icon-name="utility:undo"
                                        variant="neutral"
                                        disabled={isConfirmed}
                                        onclick={handleNoteResetClick}
                                    ></lightning-button>
                                </lightning-button-group>
                            </c-rec-filter-bar>
                        </div>

                        <div class="table-summary">
                            <span>Rows: {displayNoteRowCount} / Selected: {displayNoteSelectedCount}</span>
                            <div class="table-actions">
                                <lightning-button-group>
                                    <lightning-button-icon
                                        name="action_ExpandAll"
                                        label="Expand All"
                                        title="Expand All"
                                        alternative-text="Expand All"
                                        icon-name="utility:add"
                                        variant="neutral"
                                        onclick={handleNoteExpandAllClick}
                                    ></lightning-button-icon>
                                    <lightning-button-icon
                                        name="action_CollapseAll"
                                        label="Collapse All"
                                        title="Collapse All"
                                        alternative-text="Collapse All"
                                        icon-name="utility:dash"
                                        variant="neutral"
                                        onclick={handleNoteCollapseAllClick}
                                    ></lightning-button-icon>
                                </lightning-button-group>

                                <lightning-button
                                    name="action_NoteConfirm"
                                    label="Confirm"
                                    title="Confirm"
                                    alternative-text="Confirm"
                                    class="slds-var-m-left_small"
                                    variant="neutral"
                                    disabled={noteConfirmBtnDisabled}
                                    onclick={handleNoteConfirmClick}
                                ></lightning-button>

                                <lightning-button
                                    name="action_Select"
                                    label="Select"
                                    title="Select"
                                    class="slds-var-m-left_small"
                                    variant="brand"
                                    disabled={actionBtnsDisabled}
                                    onclick={handleNoteSelect}
                                ></lightning-button>
                            </div>
                        </div>

                        <div class="table-wrapper inquiry-table">
                            <c-rec-table
                                lwc:ref="noteTable"
                                key-field="Id"
                                columns={noteColumns}
                                data={noteData}
                                disabled-row-ids={noteDisabledRowIds}
                                onrowselection={handleNoteRowSelection}
                            ></c-rec-table>
                        </div>
                    </lightning-tab>
                </lightning-tabset>

                <!-- Selected Items -->
                <div class="table-summary">
                    <span class="table-meta">
                        Rows: {displaySelectedItemRowCount} / Selected: {displaySelectedItemSelectedCount} / Settlement
                        Currency: {displaySettlementCurrency} / Reconciled AMT: {reconciledAmount}
                    </span>
                    <div class="table-actions">
                        <lightning-button
                            label="Delete"
                            icon-name="utility:delete"
                            variant="destructive-text"
                            disabled={actionBtnsDisabled}
                            onclick={handleSelectedItemDelete}
                        ></lightning-button>
                    </div>
                </div>

                <div class="table-wrapper selected-items-table">
                    <c-rec-table
                        lwc:ref="selectedTable"
                        key-field="Id"
                        columns={selectedItemColumns}
                        data={selectedItems}
                        disabled-row-ids={selectedItemDisabledRowIds}
                        onrowselection={handleSelectedItemRowSelection}
                        oncellchange={handleSelectedItemCellChange}
                        object-api-name="ReconciliationLineItem__c"
                    ></c-rec-table>
                </div>
            </div>
        </div>

        <!-- ═══ Section 3: Other Charges ═══ -->
        <div class="section">
            <div class="section-header">
                <div class="section-header-left">
                    <span class="section-title">Other Charges</span>
                    <span class="section-notice">
                        <lightning-icon icon-name="utility:info" size="xx-small" class="notice-icon"></lightning-icon>
                        Other Charges are saved on Draft and applied upon Confirm.
                    </span>
                </div>
                <div class="section-actions">
                    <lightning-button-group>
                        <lightning-button
                            label="Delete"
                            icon-name="utility:delete"
                            variant="destructive-text"
                            disabled={actionBtnsDisabled}
                            onclick={handleOtherChargesDelete}
                        ></lightning-button>
                        <lightning-button
                            label="Add"
                            icon-name="utility:add"
                            variant="neutral"
                            disabled={actionBtnsDisabled}
                            onclick={handleOtherChargesAdd}
                        ></lightning-button>
                    </lightning-button-group>
                </div>
            </div>
            <div class="section-body">
                <c-rec-table
                    lwc:ref="otherChargesTable"
                    key-field="Id"
                    columns={otherChargesColumns}
                    data={otherChargesData}
                    disabled-row-ids={otherChargesDisabledRowIds}
                    onrowselection={handleOtherChargesRowSelection}
                    oncellchange={handleOtherChargesCellChange}
                    object-api-name="ReconciliationLineItem__c"
                ></c-rec-table>
            </div>
        </div>
    </div>
</template>
