<template>
    <lightning-modal-body>
        <lightning-layout>
            <lightning-layout-item size="8" class="slds-var-m-bottom_medium">
                <lightning-input
                    class="slds-var-m-bottom_medium"
                    type="text"
                    variant="label-inline"
                    label="Settlement Currency"
                    value={baseCurrency}
                    read-only
                ></lightning-input>
            </lightning-layout-item>
        </lightning-layout>

        <c-rec-table
            lwc:ref="fxTable"
            key-field="OriginCurrency__c"
            columns={tableColumns}
            data={settlements}
            oncellchange={handleCellChange}
            hide-checkbox-column
        ></c-rec-table>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label="Cancel" onclick={handleCancelClick} class="slds-var-m-right_small"></lightning-button>
        <lightning-button
            variant="brand"
            label="Apply"
            onclick={handleApplyClick}
            disabled={applyBtnDisabled}
        ></lightning-button>
    </lightning-modal-footer>
</template>
