<template>
    <template if:true={hideSection}>
        <div class="slds-p-around_medium">
            <!-- Brokerage Summary Section -->
            <div class="slds-grid slds-gutters">
                <!-- Header -->
                <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                    <h1 class="slds-text-heading_small slds-m-bottom_none">Brokerage Summary</h1>
                </div>
            </div>

            <!-- Summary Cards Grid -->
            <div class="summary-grid">
                <!-- Card 1: Gross Prem -->
                <div class="summary-card card1">
                    <div class="card-title">Gross Prem</div>
                    <div class="card-value">{formattedGrossPremium}</div>
                </div>

                <!-- Card 2: Total Order(%)/Signed(%) -->
                <div class="summary-card">
                    <div class="card-title doBold">Total Order(%)/Signed(%)</div>
                    <div class="card-status-container">
                        <template if:true={hasMismatchedLayers}>
                            <template for:each={mismatchedLayersList} for:item="layer">
                                <div key={layer.layerName} class="layer-comparison-item">
                                    <div class={layer.statusClass}>{layer.status}</div>
                                    <div class="status-text">{layer.layerName}</div>
                                    <div class="comparison-value">{layer.totalOrderPct} / {layer.signedPct}</div>
                                </div>
                            </template>
                        </template>
                        <template if:true={shouldShowPlacementStatus}>
                            <div class="card-value-comparison">
                                <div class="status-label status-done">Placement Done</div>
                                <div class="card-value">{formattedTotalOrderPct} / {formattedTotalOrderPct}</div>
                            </div>
                        </template>
                    </div>
                    <div class="card-button">
                        <lightning-button-icon icon-name="utility:add" alternative-text="Open Modal" variant="bare" onclick={handleOpenTotalOrderModal}></lightning-button-icon>
                    </div>
                </div>

                <!-- Card 3: Admin Fee -->
                <div class="summary-card">
                    <div class="card-list">
                        <div class="list-item">
                            <span class="item-label">Admin Fee to Producing (-)</span>
                            <span class="item-value">{formattedAdminFeeToProducing}</span>
                        </div>
                        <div class="list-item">
                            <span class="item-label">Admin Fee to LK (+)</span>
                            <span class="item-value">{formattedAdminFeeToLK}</span>
                        </div>
                    </div>
                </div>

                <!-- Card 4: Brkg -->
                <div class="summary-card">
                    <div class="card-tree">
                        <div class="tree-item level-1">
                            <span class="item-label">Total Brkg</span>
                            <span class="item-value">{formattedTotalBrkg}</span>
                        </div>
                        <div class="tree-item level-1">
                            <span class="item-label">LK Brokerage</span>
                            <span class="item-value">{formattedLKBrokerage}</span>
                        </div>
                        <div class="tree-item level-2">
                            <span class="item-label">- LK brkg</span>
                            <span class="item-value">{formattedLkReBrkge}</span>
                        </div>
                        <div class="tree-item level-2">
                            <span class="item-label">- LK Co-brokerage</span>
                            <span class="item-value">{formattedLKTPPBrokerage}</span>
                        </div>
                        <div class="tree-item level-1">
                            <span class="item-label">TPP Brokerage</span>
                            <span class="item-value">{formattedTPPBrokerage}</span>
                        </div>
                    </div>
                </div>

                <!-- Card 6: LK Re Brkg -->
                <div class="summary-card">
                    <div class="card-list">
                        <div class="list-item">
                            <span class="item-label doBold">LK Re Brokerage / %</span>
                            <span class="item-value-group">
                                <span class="item-amount">{formattedLKReBrokerage}</span>
                                <span class="item-percent">{formattedLKReBrokeragePercent}</span>
                            </span>
                        </div>
                        <div class="list-item">
                            <span class="item-label">- Proportional</span>
                            <span class="item-value-group">
                                <span class="item-amount">{formattedProportional}</span>
                                <span class="item-percent">{formattedProportionalPercent}</span>
                            </span>
                        </div>
                        <div class="list-item">
                            <span class="item-label">- Non-Proportional</span>
                            <span class="item-value-group">
                                <span class="item-amount">{formattedNonProportional}</span>
                                <span class="item-percent">{formattedNonProportionalPercent}</span>
                            </span>
                        </div>
                        <div class="list-item">
                            <span class="item-label">- Brkg Adj</span>
                            <span class="item-value-group">
                                <span class="item-amount">{formattedBrkgAdj}</span>
                                <span class="item-percent"></span>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Card 7: Brkg (after admin) -->
                <div class="summary-card">
                    <div class="card-list">
                        <div class="list-item">
                            <span class="item-label">LK Brokerage(after admin)</span>
                            <span class="item-value">{formattedLKReBrokerageAfterAdmin}</span>
                        </div>
                        <div class="list-item">
                            <span class="item-label">TPP Brokerage(after admin)</span>
                            <span class="item-value">{formattedTPPBrokerageAfterAdmin}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template if:false={hideSection}>
        <lightning-accordion allow-multiple-sections-open active-section-name="brokerageSummary">
            <lightning-accordion-section name="brokerageSummary" label="Brokerage Summary" class="nongray-section">
                <div class="slds-p-around_small">
                    <!-- Summary Cards Grid -->
                    <div class="summary-grid">
                        <!-- Card 1: Gross Prem -->
                        <div class="summary-card card1">
                            <div class="card-title">Gross Prem</div>
                            <div class="card-value">{formattedGrossPremium}</div>
                        </div>

                        <!-- Card 2: Total Order(%)/Signed(%) -->
                        <div class="summary-card">
                            <div class="card-title doBold">Total Order(%)/Signed(%)</div>
                            <div class="card-status-container">
                                <template if:true={hasMismatchedLayers}>
                                    <template for:each={mismatchedLayersList} for:item="layer">
                                        <div key={layer.layerName} class="layer-comparison-item">
                                            <div class={layer.statusClass}>{layer.status}</div>
                                            <div class="status-text">{layer.layerName}</div>
                                            <div class="comparison-value">{layer.totalOrderPct} / {layer.signedPct}</div>
                                        </div>
                                    </template>
                                </template>
                                <template if:true={shouldShowPlacementStatus}>
                                    <div class="card-value-comparison">
                                        <div class="status-label status-done">Placement Done</div>
                                        <div class="card-value">{formattedTotalOrderPct} / {formattedTotalOrderPct}</div>
                                    </div>
                                </template>
                            </div>
                            <div class="card-button">
                                <lightning-button-icon icon-name="utility:add" alternative-text="Open Modal" variant="bare" onclick={handleOpenTotalOrderModal}></lightning-button-icon>
                            </div>
                        </div>

                        <!-- Card 3: Admin Fee -->
                        <div class="summary-card">
                            <div class="card-list">
                                <div class="list-item">
                                    <span class="item-label">Admin Fee to Producing (-)</span>
                                    <span class="item-value">{formattedAdminFeeToProducing}</span>
                                </div>
                                <div class="list-item">
                                    <span class="item-label">Admin Fee to LK (+)</span>
                                    <span class="item-value">{formattedAdminFeeToLK}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Card 4: Brkg -->
                        <div class="summary-card">
                            <div class="card-tree">
                                <div class="tree-item level-1">
                                    <span class="item-label">Total Brkg</span>
                                    <span class="item-value">{formattedTotalBrkg}</span>
                                </div>
                                <div class="tree-item level-1">
                                    <span class="item-label">LK Brokerage</span>
                                    <span class="item-value">{formattedLKBrokerage}</span>
                                </div>
                                <div class="tree-item level-2">
                                    <span class="item-label">- LK Brkg</span>
                                    <span class="item-value">{formattedLkReBrkge}</span>
                                </div>
                                <div class="tree-item level-2">
                                    <span class="item-label">- LK Co-brokerage</span>
                                    <span class="item-value">{formattedLKTPPBrokerage}</span>
                                </div>
                                <div class="tree-item level-1">
                                    <span class="item-label">TPP Brokerage</span>
                                    <span class="item-value">{formattedTPPBrokerage}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Card 6: LK Re Brkg -->
                        <div class="summary-card">
                            <div class="card-list">
                                <div class="list-item">
                                    <span class="item-label doBold">LK Re Brokerage / %</span>
                                    <span class="item-value-group">
                                        <span class="item-amount">{formattedLKReBrokerage}</span>
                                        <span class="item-percent">{formattedLKReBrokeragePercent}</span>
                                    </span>
                                </div>
                                <div class="list-item">
                                    <span class="item-label">- Proportional</span>
                                    <span class="item-value-group">
                                        <span class="item-amount">{formattedProportional}</span>
                                        <span class="item-percent">{formattedProportionalPercent}</span>
                                    </span>
                                </div>
                                <div class="list-item">
                                    <span class="item-label">- Non-Proportional</span>
                                    <span class="item-value-group">
                                        <span class="item-amount">{formattedNonProportional}</span>
                                        <span class="item-percent">{formattedNonProportionalPercent}</span>
                                    </span>
                                </div>
                                <div class="list-item">
                                    <span class="item-label">- Brkg Adj</span>
                                    <span class="item-value-group">
                                        <span class="item-amount">{formattedBrkgAdj}</span>
                                        <span class="item-percent"></span>
                                    </span>
                                </div>
                            </div>
                        </div>

                        <!-- Card 7: Brkg (after admin) -->
                        <div class="summary-card">
                            <div class="card-list">
                                <div class="list-item">
                                    <span class="item-label">LK Brokerage(after admin)</span>
                                    <span class="item-value">{formattedLKReBrokerageAfterAdmin}</span>
                                </div>
                                <div class="list-item">
                                    <span class="item-label">TPP Brokerage(after admin)</span>
                                    <span class="item-value">{formattedTPPBrokerageAfterAdmin}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </lightning-accordion-section>
        </lightning-accordion>
    </template>

    <!-- Modals -->
    <template if:true={showTotalOrderModal}>
        <c-com-modal title="Total Order (%)/ Signed (%)" hide-footer size="small" oncancel={handleCloseTotalOrderModal}>
            <c-opp-total-order-signed-modal
                record-id={recordId}
                curr={selectedCurrency}
                refresh-key={modalRefreshKey}
                panel-ids={selectedPanelIds}
                onclose={handleCloseTotalOrderModal}
            ></c-opp-total-order-signed-modal>
        </c-com-modal>
    </template>
</template>
