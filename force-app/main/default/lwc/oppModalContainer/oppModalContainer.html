<template>
    <template if:true={isPopupOpen}>
        <!-- 1. 일반 팝업 (Subjectivity, Search, TextEditor) -> c-com-modal 사용 -->
        <template if:false={isSimulationPopup}>
            <c-com-modal
                title={modalTitle}
                oncancel={handleModalCancel}
                onconfirm={handleModalConfirm}
                size={sizePopup}
                hide-save={hideSaveButton}
                cancel-label={closeLabel}
                save-label={saveLabel}
                hide-footer={hideSaveButton}
            >
                <!-- 1. Subjectivity 팝업 -->
                <template if:true={isSubjectivityPopup}>
                    <c-opp-market-line-subj-mgmt-modal data-id="popupChild" popup-params={popupParams} is-read-only={isReadOnly}> </c-opp-market-line-subj-mgmt-modal>
                </template>

                <!-- 2. Market Search 팝업 -->
                <template if:true={isMarketSearchPopup}>
                    <c-opp-market-line-search-modal type={popupParams.type} record-id={recordId} parent-id={popupParams.parentId} onselect={handleRecordSelect} onclose={handleModalCancel}>
                    </c-opp-market-line-search-modal>
                </template>

                <!-- 3. Text Editor 팝업 -->
                <template if:true={isTextEditorPopup}>
                    <c-opp-market-line-text-editor-modal data-id="popupChild" value={popupParams.value} mode={popupParams.mode} record-id={recordId} is-read-only={isReadOnly}>
                    </c-opp-market-line-text-editor-modal>
                </template>
            </c-com-modal>
        </template>

        <!-- 4. Simulation 팝업 (자체 슬라이드 패널 사용) -->
        <template if:true={isSimulationPopup}>
            <c-opp-simulation
                data-id="popupChild"
                is-open={isPopupOpen}
                is-read-only={isReadOnly}
                record-id={recordId}
                selected-currency={popupParams.selectedCurrency}
                selected-panel-ids={popupParams.panelIds}
                is-placement={popupParams.isPlacement}
                is-all-q-s={popupParams.isAllQS}
                onclose={handleModalCancel}
                onfinalize={handleSimulationFinalize}
            >
            </c-opp-simulation>
        </template>
    </template>
</template>
