<template>
    <lightning-modal-header label="Settlement Line Item Split"></lightning-modal-header>
    <lightning-modal-body>
        <lightning-spinner lwc:if={isLoading} alternative-text="Loading" variant="brand"></lightning-spinner>

        <div lwc:if={errorMessage} class="slds-box slds-text-heading_small slds-text-align_center slds-theme_error">
            {errorMessage}
        </div>

        <table lwc:else class="slds-table slds-table_cell-buffer slds-table_bordered">
            <thead>
                <tr class="slds-line-height_reset">
                    <th class="slds-text-align_right" style="width: 3rem" scope="col">
                        <span class="slds-truncate"></span>
                    </th>
                    <th class="slds-text-align_center" scope="col">
                        <span class="slds-truncate">Amount</span>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr class="slds-hint-parent">
                    <td class="slds-text-align_center" data-label="#">1</td>
                    <td class="slds-text-align_right" data-label="Amount">
                        <lightning-input
                            class="input-right slds-var-m-horizontal_large"
                            type="number"
                            name="amount1"
                            value={amount1}
                            onchange={handleAmount1Change}
                            variant="label-hidden"
                            formatter="decimal"
                            step="any"
                        >
                        </lightning-input>
                    </td>
                </tr>
                <tr class="slds-hint-parent">
                    <td class="slds-text-align_center" data-label="#">2</td>
                    <td class="slds-text-align_right" data-label="Amount">
                        <lightning-input
                            class="input-right slds-var-m-horizontal_large"
                            type="number"
                            name="amount2"
                            value={amount2}
                            onchange={handleAmount2Change}
                            variant="label-hidden"
                            formatter="decimal"
                            step="any"
                        >
                        </lightning-input>
                    </td>
                </tr>
            </tbody>
            <thead>
                <tr>
                    <th class="slds-text-align_center">
                        <strong>Total Amount</strong>
                    </th>
                    <th class="slds-text-align_center">
                        <strong style="color: red">
                            <lightning-formatted-number
                                value={totalAmount}
                                format-style="currency"
                                currency-code={currency}
                                currency-display-as="symbol"
                            >
                            </lightning-formatted-number>
                        </strong>
                    </th>
                </tr>
            </thead>
        </table>
    </lightning-modal-body>
    <lightning-modal-footer>
        <div class="slds-grid slds-grid_align-center">
            <lightning-button
                class="slds-m-right_x-small"
                variant={cancelBtnVariant}
                label={cancelBtnLabel}
                onclick={handleCancelClick}
            ></lightning-button>
            <lightning-button
                if:false={errorMessage}
                variant="brand"
                label="Save"
                onclick={handleSaveClick}
                disabled={saveBtnDisabled}
            ></lightning-button>
        </div>
    </lightning-modal-footer>
</template>
