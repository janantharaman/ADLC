<template>
    <lightning-quick-action-panel header={labels.title}>
        <div class="slds-p-around_medium slds-text-align_center">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
            </template>

            <template if:true={hasError}>
                <p class="slds-text-color_error slds-text-body_regular">{errorMessage}</p>
            </template>

            <template if:true={showOmniScript}>
                <lightning-omnistudio-omniscript
                    type={scriptType}
                    sub-type={scriptSubType}
                    language={scriptLanguage}
                    prefill={seedDataJson}
                >
                </lightning-omnistudio-omniscript>
            </template>
        </div>
    </lightning-quick-action-panel>
</template>
