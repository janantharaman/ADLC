<!--
  @description       : Evaluation Settlement Line Item Inquiry
  @author            : AI
-->
<template>
    <div class="container">
        <div lwc:if={_isLoading} class="spinner">
            <lightning-spinner alternative-text={label.loading} size="large"></lightning-spinner>
        </div>

        <!-- TITLE -->
        <div class="title slds-text-heading_medium slds-var-p-around_medium slds-text-font_monospace">{label.pageTitle}</div>

        <!-- FILTER -->
        <div class="filter-wrapper slds-box slds-box_xx-small slds-var-m-vertical_medium">
            <c-rec-filter-bar
                filter-defs={filterDefs}
                filter-width="9"
                lwc:ref="filterEval"
                onfilterchange={handleFilterChange}
            >
                <lightning-button-group slot="actions">
                    <lightning-button
                        name="action_Inquiry"
                        label={label.btnInquiry}
                        icon-name="utility:search"
                        variant="brand"
                        onclick={handleInquiryClick}
                    ></lightning-button>
                    <lightning-button
                        name="action_Reset"
                        label={label.btnReset}
                        icon-name="utility:undo"
                        variant="neutral"
                        onclick={handleResetClick}
                    ></lightning-button>
                </lightning-button-group>
                <lightning-button-group slot="actions">
                    <lightning-button
                        name="action_Evaluation"
                        label={label.btnEvaluation}
                        variant="neutral"
                        disabled={evaluationBtnDisabled}
                        onclick={handleEvaluationClick}
                    ></lightning-button>
                    <lightning-button
                        name="action_RemoveEvaluation"
                        label={label.btnRemove}
                        variant="destructive-text"
                        disabled={removeEvaluationBtnDisabled}
                        onclick={handleRemoveEvaluationClick}
                    ></lightning-button>
                </lightning-button-group>
            </c-rec-filter-bar>
        </div>

        <!-- TABLE -->
        <div class="table-summary">
            <span>{tableSummary}</span>
            <div class="table-actions">
                <lightning-button-group>
                    <lightning-button-icon
                        name="action_ExpandAll"
                        label={label.btnExpandAll}
                        title={label.btnExpandAll}
                        icon-name="utility:add"
                        variant="neutral"
                        onclick={handleExpandAllClick}
                    ></lightning-button-icon>
                    <lightning-button-icon
                        name="action_CollapseAll"
                        label={label.btnCollapseAll}
                        title={label.btnCollapseAll}
                        icon-name="utility:dash"
                        variant="neutral"
                        onclick={handleCollapseAllClick}
                    ></lightning-button-icon>
                </lightning-button-group>
                <lightning-button
                    variant="neutral"
                    label={label.btnExport}
                    icon-name="utility:download"
                    class="slds-p-left_small"
                    onclick={handleExportClick}
                ></lightning-button>
            </div>
        </div>
        <div class="table-wrapper">
            <c-rec-table
                lwc:ref="table"
                key-field="Id"
                columns={tableColumns}
                data={tableData}
                onrowselection={handleRowSelection}
                oncellchange={handleCellChange}
                oncellbuttonclick={handleCellButtonClick}
                ongroupcollapse={handleGroupCollapse}
                ondirtystatechange={handleDirtyStateChange}
            ></c-rec-table>
        </div>

        <!-- Remove Evaluation Confirm Modal -->
        <template lwc:if={_showRemoveModal}>
            <c-com-modal
                title={label.btnRemove}
                hide-header="true"
                size="small"
                onconfirm={handleRemoveModalConfirm}
                oncancel={handleRemoveModalCancel}
            >
                <p>{label.confirmRemoveEvaluation}</p>
            </c-com-modal>
        </template>
    </div>
</template>
