<template>
    <!--
        number-range: Two inline number inputs (From / To).
        getValue() returns { name, value: { from, to } }.
    -->
    <lightning-layout vertical-align="center" multiple-rows>
        <lightning-layout-item size={labelSize} class={labelClass}>
            <span class="slds-text-body_small slds-text-color_weak">
                <template if:true={isRequired}><abbr class="slds-required" title="required">*</abbr></template
                >{label}
            </span>
        </lightning-layout-item>
        <lightning-layout-item size={contentSize} class="slds-p-horizontal_x-small">
            <div class="slds-grid slds-gutters_xx-small slds-grid_vertical-align-center">
                <div class="slds-col slds-size_5-of-12">
                    <lightning-input
                        type="number"
                        variant="label-hidden"
                        placeholder="From"
                        value={numberRangeFrom}
                        disabled={isDisabled}
                        data-range="from"
                        onchange={handleNumberRangeChange}
                        onblur={handleNumberRangeBlur}
                    ></lightning-input>
                </div>
                <div class="slds-col slds-size_2-of-12 slds-text-align_center">
                    <span class="slds-text-body_small slds-text-color_weak">~</span>
                </div>
                <div class="slds-col slds-size_5-of-12">
                    <lightning-input
                        type="number"
                        variant="label-hidden"
                        placeholder="To"
                        value={numberRangeTo}
                        disabled={isDisabled}
                        data-range="to"
                        onchange={handleNumberRangeChange}
                        onblur={handleNumberRangeBlur}
                    ></lightning-input>
                </div>
            </div>
        </lightning-layout-item>
    </lightning-layout>
</template>
