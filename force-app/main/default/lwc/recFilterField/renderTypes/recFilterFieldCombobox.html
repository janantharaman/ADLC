<template>
    <!--
        combobox: position:fixed dropdown — escapes overflow containers.
        Options from @wire (picklistObject/picklistField) or static config.options.
        config.multiple = true → multi-select: toggles without closing, × clear button.
    -->
    <lightning-layout vertical-align="center" multiple-rows>
        <lightning-layout-item size={labelSize} class={labelClass}>
            <span class="slds-text-body_small slds-text-color_weak">
                <template if:true={isRequired}><abbr class="slds-required" title="required">*</abbr></template
                >{label}
            </span>
        </lightning-layout-item>
        <lightning-layout-item size={contentSize} class="slds-p-horizontal_x-small">
            <!-- Trigger -->
            <div
                class={cmbTriggerClass}
                tabindex={cmbTabIndex}
                role="combobox"
                aria-haspopup="listbox"
                aria-expanded={cmbIsOpen}
                onclick={handleComboboxToggle}
                onkeydown={handleComboboxKeydown}
            >
                <span class="cmb-trigger__text">{cmbSelectedLabel}</span>
                <template if:true={cmbHasSelection}>
                    <button class="cmb-trigger__clear" type="button" tabindex="-1" onclick={handleComboboxClear}>
                        <lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon>
                    </button>
                </template>
                <lightning-icon icon-name="utility:chevrondown" size="x-small" class="cmb-trigger__icon"></lightning-icon>
            </div>

            <!-- Dropdown (position:fixed injected via JS) -->
            <template if:true={cmbIsOpen}>
                <div class="cmb-backdrop" onclick={handleComboboxClose}></div>
                <ul class="cmb-dropdown" style={cmbDropdownStyle} role="listbox" aria-multiselectable={isMultiple}>
                    <template for:each={cmbItems} for:item="opt">
                        <li
                            key={opt.value}
                            class={opt.cls}
                            role="option"
                            aria-selected={opt.isChecked}
                            data-value={opt.value}
                            onclick={handleComboboxSelect}
                        >
                            <template if:true={opt.showCheck}>
                                <span class="cmb-opt__check-wrap">
                                    <template if:true={opt.isChecked}>
                                        <lightning-icon
                                            icon-name="utility:check"
                                            size="xx-small"
                                            class="cmb-opt__check"
                                        ></lightning-icon>
                                    </template>
                                </span>
                            </template>
                            <span class="cmb-opt__label">{opt.label}</span>
                        </li>
                    </template>
                </ul>
            </template>
        </lightning-layout-item>
    </lightning-layout>
</template>
