<template>
    <template if:true={isOpen}>
        <!-- 오버레이 -->
        <div class="overlay" onclick={handleOverlayClick}></div>

        <!-- 슬라이드 패널 -->
        <div class={panelClass}>
            <div class="panel-header">
                <h3 class="slds-text-heading_medium">Market Line Simulation</h3>
                <lightning-button-icon icon-name="utility:close" variant="bare" size="large" alternative-text="Close" onclick={handleClose}> </lightning-button-icon>
            </div>

            <div class="panel-content">
                <!-- Button Section -->
                <div class="slds-text-align_right">
                    <lightning-button label={labels.calculate} variant="neutral" onclick={handleCalculate} disabled={isCalculateBtnDisabled}></lightning-button>
                    <lightning-button label={labels.finalize} variant="brand" onclick={handleFinalize} disabled={isFinalizeBtnDisabled} class="slds-m-left_x-small"></lightning-button>
                </div>

                <!-- Brokerage Summary Section -->
                <div class="slds-m-bottom_medium">
                    <c-opp-brokerage-summary
                        record-id={recordId}
                        hide-section="true"
                        selected-currency={selectedCurrency}
                        selected-panel-ids={summaryPanelIds}
                        adjustment-data={brkgAdjForSummary}
                    ></c-opp-brokerage-summary>
                </div>

                <template if:false={isAllQS}>
                    <!-- Chart Section -->
                    <div class="slds-col slds-size_1-of-1">
                        <div class="chart-section slds-m-bottom_medium">
                            <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                                <h3 class="section-title">
                                    <lightning-icon icon-name="standard:flow" size="small"></lightning-icon>
                                    Market Line Simulation Chart
                                </h3>
                                <div class="selection-info">
                                    <lightning-badge label={selectionInfo} class="slds-m-left_small"></lightning-badge>
                                </div>
                            </div>

                            <!-- ✅ 여기서부터: 차트(왼쪽) + 검증표(오른쪽) -->
                            <div class="slds-grid slds-gutters slds-wrap chart-with-verification">
                                <!-- Left: Chart -->
                                <div class="slds-col slds-size_1-of-1 slds-large-size_9-of-12">
                                    <div class="chart-container" lwc:dom="manual"></div>
                                </div>

                                <!-- Right: Verification Table (Compact) -->
                                <div class="slds-col slds-size_1-of-1 slds-large-size_3-of-12">
                                    <template if:true={hasVerificationData}>
                                        <div class="veri-list">
                                            <div class="veri-header slds-grid slds-grid_align-spread">
                                                <div class="hdr">Layer Limit</div>
                                                <div class="hdr right">Signed Line</div>
                                            </div>

                                            <template for:each={verificationView} for:item="row">
                                                <div key={row.layerId} class="veri-row slds-grid slds-grid_align-spread">
                                                    <div class="limit">{row.layerLimit}</div>
                                                    <div class="signed" style={row.signedStyle}>{row.signedText}</div>
                                                </div>
                                            </template>

                                            <!-- Legend -->
                                            <div class="veri-legend">
                                                <div class="legend-item">
                                                    <span class="legend-color legend-overplaced"></span>
                                                    <span class="legend-text">Over Placed</span>
                                                </div>
                                                <div class="legend-item">
                                                    <span class="legend-color legend-shortfall"></span>
                                                    <span class="legend-text">Shortfall</span>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Unified Panel Grid Section -->
                <div class="slds-m-bottom_medium">
                    <div class="grid-section">
                        <h3 class="section-title">
                            <lightning-icon icon-name="standard:record" size="small"></lightning-icon>
                            Selected Panels
                        </h3>
                        <template if:true={hasPanelData}>
                            <div class="slds-scrollable_x">
                                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered panel-table">
                                    <thead>
                                        <tr class="slds-line-height_reset">
                                            <th scope="col" class="panel-check-th slds-text-align_center" style="width: 3rem" if:true={showCheckbox}>
                                                <input type="checkbox" checked={isAllSelected} aria-label="Select all rows" onchange={handleSelectAll} />
                                            </th>
                                            <th scope="col" class="slds-text-align_center" style="width: 60px">No</th>
                                            <th scope="col" class="slds-text-align_center" style="width: 80px">{finalizeLabel}</th>
                                            <th scope="col" class="slds-text-align_center" style="width: 110px">{layerTypeLabel}</th>
                                            <th scope="col" class="slds-text-align_center" style="width: 120px">{lolLabel}</th>
                                            <th scope="col" class="slds-text-align_center" style="width: 120px">{excessLabel}</th>
                                            <th scope="col" class="slds-text-align_center" style="width: 110px">{signedLabel}</th>
                                            <th scope="col" class="slds-text-align_center" style="width: 140px">{grossPremLabel}</th>
                                            <th scope="col" class="slds-text-align_center" style="width: 140px">{totalBrkgLabel}</th>
                                            <th scope="col" class="slds-text-align_center" style="width: 140px">{netToLKPremLabel}</th>
                                            <th scope="col" class="slds-text-align_center" style="width: 130px">{lkReBrkgeLabel}</th>
                                            <th scope="col" class="slds-text-align_center" style="width: 130px">{netRILabel}</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={tableRows} for:item="row">
                                            <tr key={row.id} class={row.rowClass}>
                                                <td class="panel-check-td slds-text-align_center" if:true={showCheckbox}>
                                                    <input
                                                        type="checkbox"
                                                        checked={row.isSelected}
                                                        disabled={row.isDisabled}
                                                        data-row-id={row.id}
                                                        aria-label={row.ariaLabel}
                                                        onchange={handleCheckboxChange}
                                                    />
                                                </td>
                                                <td class="slds-text-align_right">{row.no}</td>
                                                <td class="slds-text-align_center">{row.finalizeDisplay}</td>
                                                <td>{row.layerType}</td>
                                                <td class="slds-text-align_right">{row.lolDisplay}</td>
                                                <td class="slds-text-align_right">{row.excessDisplay}</td>
                                                <td class="slds-text-align_right">{row.signedDisplay}</td>
                                                <td class="slds-text-align_right">{row.grossPremiumDisplay}</td>
                                                <td class="slds-text-align_right">{row.totalBrkgDisplay}</td>
                                                <td class="slds-text-align_right">{row.netToLKPremDisplay}</td>
                                                <td class="slds-text-align_right">{row.lkReBrkgeDisplay}</td>
                                                <td class="slds-text-align_right">{row.netRIDisplay}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                        <template if:false={hasPanelData}>
                            <div class="slds-text-align_center slds-p-around_medium">
                                <p class="slds-text-color_weak">No panels selected</p>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>
    </template>
</template>
