<template>
    <div class={_fieldsClass}>
        <template for:each={fieldItems} for:item="item">
            <div key={item.key} class={item.wrapClass}>
                <template if:true={item.isDivider}>
                    <div class="rfb-divider"></div>
                </template>
                <template if:true={item.isField}>
                    <c-rec-filter-field
                        config={item.config}
                        variant={variant}
                        onfieldchange={handleFieldChange}
                        onfielderror={handleFieldError}
                    ></c-rec-filter-field>
                    <template if:true={item.hasError}>
                        <div class="rfb-error-message">{item.errorMessage}</div>
                    </template>
                </template>
                <!-- blank: empty spacer -->
            </div>
        </template>

        <!-- Action buttons: pushed to end of last row -->
        <div class="rfb-actions">
            <slot name="actions"></slot>
        </div>
    </div>
    <div lwc:if={collapsible} class="rfb-collapse-bar">
        <lightning-button-icon
            icon-name={_collapseIconName}
            variant="bare"
            size="small"
            alternative-text="Toggle Filter"
            onclick={handleCollapseToggle}
        ></lightning-button-icon>
    </div>
</template>
